<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randomizer</title>
<meta name="description" content="Tap a list, get an answer.">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ---------- Brand font ---------- */
  /* Plus Jakarta Sans, Latin letters, one file covers weights 400 to 700. */
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("fonts/plus-jakarta-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* ---------- Design tokens (light) ---------- */
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --surface-2: #EBEFF3;
    --line: rgba(12, 18, 26, 0.08);
    --text: #0A0F14;
    --muted: #5E6A76;
    --accent: #0891B2;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(8, 145, 178, 0.10);
    --glow: 0 6px 20px rgba(8, 145, 178, 0.25);
    --text-glow: none;
    --danger: #DC2626;
    --shadow: 0 1px 2px rgba(12, 18, 26, 0.04), 0 8px 24px rgba(12, 18, 26, 0.06);
    --lift: 0 12px 28px rgba(12, 18, 26, 0.16);
    --radius: 18px;
    --gold: #A86F00;
    --gold-hi: #E0A100;
    color-scheme: light dark;
  }
  /* ---------- Design tokens (dark) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07090C;
      --surface: #0F1318;
      --surface-2: #181D24;
      --line: rgba(255, 255, 255, 0.07);
      --text: #E9EEF3;
      --muted: #8994A0;
      --accent: #22D3EE;
      --accent-ink: #03161B;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --glow: 0 0 28px rgba(34, 211, 238, 0.35);
      --text-glow: 0 0 32px rgba(34, 211, 238, 0.35);
      --danger: #F87171;
      --shadow: none;
      --lift: 0 12px 32px rgba(0, 0, 0, 0.6);
      --gold: #FFC933;
      --gold-hi: #FFF3B8;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .view {
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }

  /* ---------- Shared pieces ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; padding: 20px 2px 16px; }
  .head h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  /* Home header: die logo, app name + one-line tagline, then + and menu. */
  .head:has(.logo) { justify-content: flex-start; gap: 12px; }
  .logo {
    width: 46px; height: 46px; flex: none;
    display: grid; place-items: center;
    border-radius: 14px;
    background: var(--accent-soft); color: var(--accent);
    box-shadow: var(--glow);
  }
  .head-text { flex: 1; min-width: 0; }
  .tagline { margin: 4px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .head:has(.logo) > .iconbtn { margin-right: -6px; }

  /* Home: search + sort, then label filter chips. */
  .toolbar { display: flex; gap: 8px; margin: 0 0 10px; }
  .search {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: var(--text); font-size: 16px; }
  .search input::placeholder { color: var(--muted); }
  .sortbtn { height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 14px; flex: none; }
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px 12px; padding: 2px 16px;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .pick-chips { margin-top: -4px; }
  .chip {
    flex: none; height: 34px; padding: 0 14px;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) 75% 55%); }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .chip.on i { background: currentColor; }
  .no-match { text-align: center; padding: 24px 0; }
  .no-match .hint { margin-bottom: 12px; }

  /* Label pills (on Home rows, the edit screen and the Labels sheet). */
  .pill-label {
    display: inline-block; vertical-align: 1px;
    margin-right: 6px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600; line-height: 18px;
    background: hsl(var(--h) 80% 50% / 0.14); color: hsl(var(--h) 65% 36%);
  }
  @media (prefers-color-scheme: dark) { .pill-label { color: hsl(var(--h) 85% 72%); } }
  .row .row-text > .pill-label { font-size: 14px; line-height: 24px; padding: 1px 10px; }
  .labels-in {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0;
    height: auto; min-height: 50px; padding: 10px 14px; margin-bottom: 22px; text-align: left;
  }
  .labels-in:active { background: var(--surface-2); }
  .labels-add { font-size: 15px; color: var(--accent); font-weight: 600; }

  /* Option badges: a wrapping row of pills under an option. */
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .badges .pill-label { margin-right: 0; }
  /* The Rainbow tier (the rarest passives): a rainbow pill. */
  .pill-label.rainbow {
    color: #1A1030; background: linear-gradient(90deg, #FF8A8A, #FFD27A, #9BF0A0, #8FD3FF, #C9A2FF);
  }
  .answer-badges { justify-content: center; gap: 8px; margin-top: -8px; }
  .answer-badges .pill-label { font-size: 15px; line-height: 22px; padding: 3px 12px; }
  .answer-badges.reveal { animation: reveal 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) 0.15s both; }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item-main .badges { margin: 0 0 11px; }
  .item-main:has(.badges) .item-in { height: 40px; margin-top: 2px; }
  .iconbtn.has-badges { color: var(--accent); }
  .item-row.ro { display: block; }
  .item-row.ro .badges { margin-top: 4px; }
  .sheet-label { margin-top: 18px; }
  .still { animation: none !important; }

  /* Floating "+" on Home: bottom right, inside the app's column on wide screens. */
  .fab {
    position: fixed; z-index: 5;
    right: max(16px, calc((100vw - 560px) / 2 + 16px));
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 60px; height: 60px;
    display: grid; place-items: center;
    border: 0; border-radius: 20px;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: var(--glow), var(--lift);
    transition: transform 0.08s ease;
  }
  .fab:active { transform: scale(0.94); }
  .view:has(> .fab) { padding-bottom: calc(96px + env(safe-area-inset-bottom)); } /* last row can scroll clear of it */
  /* While a list is lifted, + becomes a trash can: drop the list on it to delete. */
  .fab > span { display: grid; }
  .fab-trash { display: none !important; }
  body.is-dragging .fab { background: var(--danger); color: #FFFFFF; box-shadow: var(--lift); transition: transform 0.15s cubic-bezier(0.3, 1.5, 0.5, 1); }
  body.is-dragging .fab-plus { display: none; }
  body.is-dragging .fab-trash { display: grid !important; }
  body.is-dragging .fab.armed { transform: scale(1.2); box-shadow: 0 0 0 8px rgba(220, 38, 38, 0.25), var(--lift); }
  [data-sort] > .dragging.to-trash { opacity: 0.6; }

  .iconbtn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 12px;
  }
  .iconbtn:active { background: var(--surface-2); }
  .iconbtn.sm { width: 40px; height: 40px; color: var(--muted); }

  .pill {
    height: 36px; padding: 0 16px;
    border: 0; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 15px;
  }
  .pill:active { opacity: 0.7; }

  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 68px;
    padding: 12px 14px;
    background: none; border: 0; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--surface-2); }
  .row.compact { min-height: 52px; padding: 10px 16px; }

  .emoji {
    position: relative;
    width: 42px; height: 42px; flex: none;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 22px;
  }
  .badge {
    position: absolute; right: -5px; bottom: -5px;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 7px; border: 2px solid var(--surface);
    background: var(--accent); color: var(--accent-ink);
  }
  .row-text { flex: 1; min-width: 0; }
  .row-name, .row-sub, .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-name { font-size: 16px; font-weight: 600; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  /* Long description is cut with … but the item count after it stays visible. */
  .sub-split { display: flex; }
  .sub-split > span:last-child { flex: none; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); opacity: 0.6; display: grid; }
  .check { color: var(--accent); display: grid; flex: none; }

  .hint { font-size: 14px; color: var(--muted); margin: 0 2px 14px; line-height: 1.45; }

  .btn {
    flex: 1; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface);
    font-size: 16px; font-weight: 600;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { flex: 1.5; background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow); }
  .btn.ghost { margin-top: 12px; flex: none; width: 100%; color: var(--accent); background: transparent; border-style: dashed; }
  .btn.sm { height: 48px; flex: none; padding: 0 20px; border-radius: 12px; }
  .btn[aria-disabled="true"], .linkbtn[aria-disabled="true"] { opacity: 0.45; }
  .btn.danger { background: var(--danger); color: #FFFFFF; border-color: transparent; }
  .ask-text { white-space: pre-line; margin-bottom: 20px; }

  /* Wheel toggle: a switch inside a normal button */
  .switch { position: relative; width: 36px; height: 22px; flex: none; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); transition: background 0.2s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.2s ease, background 0.2s ease; }
  .toggle[aria-checked="true"] .switch { background: var(--accent); border-color: transparent; }
  .toggle[aria-checked="true"] .switch::after { transform: translateX(14px); background: var(--accent-ink); }
  /* Eye: is this category visible? */
  .eyebtn { flex: none; display: grid; place-items: center; color: var(--accent); }
  .eyebtn.is-off { color: var(--muted); }
  .row.off .row-text { opacity: 0.45; }
  .group-hint { margin: 10px 4px 16px; font-size: 13px; }

  /* ---------- Top bar (result + edit) ---------- */
  /* Pinned to the top of the screen. It runs edge to edge (and up under the
     status bar) with the page's own background, so content scrolls under it. */
  .topbar {
    position: sticky; top: 0; z-index: 4;
    display: flex; align-items: center; gap: 6px;
    height: calc(64px + env(safe-area-inset-top));
    margin: calc(-1 * env(safe-area-inset-top)) -16px 0;
    padding: calc(8px + env(safe-area-inset-top)) 10px 0;
    background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 60%) fixed, var(--bg);
  }
  .top-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }

  /* ---------- Result screen ---------- */
  .stage {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px 8px;
    text-align: center;
  }
  .answer {
    margin: 0;
    padding: 0;
    background: none;
    border: 0;
    color: inherit;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.08;
    text-wrap: balance;
    overflow-wrap: anywhere;
    text-shadow: var(--text-glow);
    cursor: pointer;
    animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    transition: opacity 0.12s ease;
  }
  .answer:active { opacity: 0.6; }
  .copy-hint { margin: -12px 0 0; font-size: 13px; color: var(--muted); }
  .answer.s { font-size: clamp(42px, 13vw, 68px); }
  .answer.m { font-size: clamp(32px, 10vw, 50px); }
  .answer.l { font-size: clamp(26px, 7.5vw, 38px); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  /* ---------- Spinning wheel (when the Wheel toggle is on) ----------
     Circus marquee: bright slices, a gold rim of chasing bulbs, light rays
     and a color-cycling glow behind. Same colors in light and dark mode. */
  .stage.spin { overflow: hidden; }
  .wheel { position: relative; width: min(84vw, 340px, 50vh); aspect-ratio: 1; animation: wheel-in 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes wheel-in { from { transform: scale(0.3) rotate(-40deg); opacity: 0; } }
  .wheel > * { position: absolute; }
  .wheel-rays {
    inset: -32%; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255, 195, 0, 0.22) 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(closest-side, #000 35%, transparent);
            mask: radial-gradient(closest-side, #000 35%, transparent);
    animation: rays 16s linear infinite;
  }
  .wheel-glow {
    inset: -12%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 70, 90, 0.55), rgba(255, 195, 0, 0.25) 55%, transparent);
    animation: glow 1.6s ease-in-out infinite alternate, hue 5s linear infinite;
  }
  .wheel.spinning .wheel-rays { animation-duration: 3s; }
  .wheel.won .wheel-glow { animation: glow 0.25s ease-in-out infinite alternate, hue 1s linear infinite; }
  @keyframes rays { to { transform: rotate(1turn); } }
  @keyframes glow { from { opacity: 0.55; transform: scale(0.94); } to { opacity: 1; transform: scale(1.06); } }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  .wheel-disc { top: 6%; left: 6%; width: 88%; height: 88%; }
  .wheel-disc .sh { stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.5; }
  .wheel-disc .c0 .sh { fill: #E63946; }
  .wheel-disc .c1 .sh { fill: #FFC300; }
  .wheel-disc .c2 .sh { fill: #2667FF; }
  .wheel-disc .c3 .sh { fill: #FF7A00; }
  .wheel-disc .c4 .sh { fill: #8E3CCB; }
  .wheel-disc .c5 .sh { fill: #1E9E5A; }
  .wheel-disc text { fill: #FFFFFF; font-weight: 700; paint-order: stroke; stroke: rgba(0, 0, 0, 0.2); stroke-width: 2px; }
  .wheel-disc .c1 text, .wheel-disc .c3 text { fill: #2A1600; stroke: rgba(255, 255, 255, 0.3); }
  .wheel-disc g { transition: opacity 0.3s ease; }
  .wheel.won .wheel-disc g:not(.win) { opacity: 0.4; }
  .wheel-disc .win .sh { stroke: #FFFFFF; stroke-width: 4; }

  .wheel-frame { inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
  .bulb { --d: 0.9s; fill: #FFF6C8; animation: bulb var(--d) steps(1) infinite; }
  .bulb:nth-child(even) { animation-delay: calc(var(--d) / -2); }
  .wheel.spinning .bulb { --d: 0.22s; }
  .wheel.won .bulb { animation: flash 0.18s steps(1) infinite; }
  @keyframes bulb { 50% { fill: #7A5200; } }
  @keyframes flash { 50% { fill: #FF4D6D; } }

  /* Pointer sits at 3 o'clock, pointing left at the wheel. */
  .wheel-pointer { top: 43.5%; right: -6%; width: 17%; transform-origin: 70% 50%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4)); }

  /* The answer zooms in after the wheel stops. */
  .answer.reveal { animation: reveal 0.6s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes reveal { from { opacity: 0; transform: scale(0.2); filter: blur(8px); } }

  .confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; }
  .empty-title { margin: 0; font-size: 22px; font-weight: 700; }
  .empty-text { margin: -12px 0 0; font-size: 15px; color: var(--muted); }

  .actions { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 18px; }
  .btn-row { display: flex; gap: 10px; }
  .linkbtn {
    align-self: center; height: 44px; padding: 0 14px;
    display: flex; align-items: center; gap: 8px;
    background: none; border: 0; border-radius: 12px;
    color: var(--muted); font-size: 14px; font-weight: 500;
  }
  .linkbtn:active { background: var(--surface-2); }

  /* ---------- Multiple result: one row per category ---------- */
  .combo { width: 100%; text-align: left; }
  .combo-row { display: flex; align-items: center; padding-right: 6px; }
  .combo-row + .combo-row { border-top: 1px solid var(--line); }
  .combo-row.locked { background: var(--accent-soft); }
  .combo-main { flex: 1; min-width: 0; display: block; padding: 14px 6px 14px 18px; background: none; border: 0; text-align: left; }
  .combo-main:active { background: var(--surface-2); }
  .combo-cat { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combo-val { display: block; margin-top: 3px; font-size: clamp(22px, 6.4vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .lockbtn { color: var(--muted); }
  .combo-row .grip { margin-left: -4px; }
  .combo-row.locked .lockbtn { color: var(--accent); }
  /* A rare option came up (e.g. Shiny): the row and the screen edges glow gold. */
  .combo-row.gold { background: rgba(255, 196, 0, 0.12); box-shadow: inset 0 0 0 1.5px var(--gold), inset 0 0 22px rgba(255, 196, 0, 0.25); }
  .combo-row.gold .combo-cat { color: var(--gold); }
  .combo-row.gold .combo-val:not(.reel) {
    color: transparent;
    background: linear-gradient(100deg, var(--gold), var(--gold-hi), var(--gold)) 0 0 / 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    animation: gold-shine 2.4s linear infinite;
  }
  .combo-row.gold .pill-label { --h: 45 !important; }
  /* A near-best option (IV 90–99%): the soft accent highlight. */
  .combo-row.silver { background: var(--accent-soft); }
  .combo-val.empty { color: var(--muted); font-weight: 600; opacity: 0.6; }
  /* A group row (Passive Skills): one tappable block per slot that came up. */
  .combo-group { cursor: default; }
  .combo-group:active { background: none; }
  .combo-sub { display: block; width: calc(100% + 16px); margin: 0 0 0 -8px; padding: 4px 8px 6px; background: none; border: 0; border-radius: 12px; text-align: left; }
  .combo-sub:active { background: var(--surface-2); }
  .combo-sub + .combo-sub { margin-top: 6px; }
  .combo-val.sub { font-size: clamp(19px, 5.4vw, 23px); }
  .sub-lock { display: inline-block; margin-left: 6px; vertical-align: -1px; color: var(--accent); }
  .sub-lock svg { width: 15px; height: 15px; }

// What each nature does: the stat it raises, then the one it lowers (by 10%).
// The other five natures (Bashful, Docile, Hardy, Quirky, Serious) change nothing.
const NATURE_FX = {
  Adamant: "Atk SpA", Bold: "Def Atk", Brave: "Atk Spe", Calm: "SpD Atk", Careful: "SpD SpA", Gentle: "SpD Def",
  Hasty: "Spe Def", Impish: "Def SpA", Jolly: "Spe SpA", Lax: "Def SpD", Lonely: "Atk Def", Mild: "SpA Def",
  Modest: "SpA Atk", Naive: "Spe SpD", Naughty: "Atk SpD", Quiet: "SpA Spe", Rash: "SpA SpD", Relaxed: "Def Spe",
  Sassy: "SpD Spe", Timid: "Spe Atk",
};
// Option badges for a list of natures, e.g. Adamant → ["+10% Atk", "−10% SpA"].
const natureBadges = (names) => Object.fromEntries(names.filter((n) => POKEMON.cats.Nature.includes(n)).map((n) => [n,
  NATURE_FX[n] ? NATURE_FX[n].split(" ").map((s, i) => (i ? "−10% " : "+10% ") + s) : ["No effect"]]));

// Shiny and Lucky are rare: "Yes" comes up 1 time in 100 and gets a golden celebration (see `rare`).
const rareYes = () => ({ rare: { item: "Yes", odds: 100 }, badges: { Yes: ["1/100 chance"] } });
const shinyCat = () => ({ id: uid(), name: "Shiny", items: ["No", "Yes"], ...rareYes() });

const pokemonMulti = () => ({
  id: uid(), name: POKEMON.name, emoji: POKEMON.emoji, description: POKEMON.description, type: "multi",
  cats: [...Object.entries(POKEMON.cats).map(([name, items]) =>
    ({
      id: uid(), name, items,
      ...(name === "Nature" && { badges: natureBadges(items) }),
      ...(name === "Hidden Ability" && { notes: { ...HIDDEN_ABILITIES } }),
      ...(POKEMON_FIT[name] && { fit: structuredClone(POKEMON_FIT[name]) }),
    })), shinyCat()],
});

  const cat = (name, items, col, more) => ({ id: uid(), name, items, ...(col != null && { fit: { Pal: palRows(col), ...more } }) });
  return {
    id: uid(), name: PALWORLD.name, emoji: PALWORLD.emoji, description: PALWORLD.description, type: "multi", created: Date.now(),
    cats: [
      cat("Pal", Object.keys(PALS)),
      cat("Region", options(6), 6),
      palHabitatCat(),

      cat("Rarity", ["Common", "Rare", "Epic", "Legendary"], 1),
      { ...cat("Size", ["XS", "S", "M", "L", "XL"], 2), grow: { ...PAL_GROW } },
      cat("Activity", ["Daytime", "Nocturnal"], 3),
      cat("Gender", ["Male", "Female"]),
      palWorkCat(),
      { ...cat("Partner Ability", Object.keys(PAL_PARTNERS), 4, { Type: palPairsBy(palTypeSet, (n) => PALS[n][4]) }), notes: { ...PAL_PARTNERS }, badges: structuredClone(PAL_PARTNER_BADGES) },
      palCountCat(),
      ...palPassiveCats(),

/* =========================================================
   2. Saving (everything lives on this phone only)

const KEY = "randomizer.v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const clean = (items) => items.map((s) => String(s).trim()).filter(Boolean);

function listsFromBackup(obj, order = []) {
  const names = [...order.filter((n) => n in obj), ...Object.keys(obj).filter((n) => !order.includes(n))];
  return names
    .filter((n) => Array.isArray(obj[n]))
    .map((n) => ({ id: uid(), name: n.trim(), emoji: EMOJI[n] || DEFAULT_EMOJI, items: clean(obj[n]) }));
}

function load() {
  let d;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.lists)) {
      delete saved.skips; // left over from the old "Skip today" button
      d = saved;
    }
  } catch (e) {}
  d = d || { lists: listsFromBackup(BACKUP, ORDER), history: {} };
  // Add the Pokémon Multiple once; if you delete it, it stays gone.
  if (!d.seeded) {
    if (!d.lists.some((l) => l.name === POKEMON.name)) d.lists.unshift(pokemonMulti());
    d.seeded = true;
  }
  // Same for the country list, added at the end.
  if (!d.seededCountries) {
    if (!d.lists.some((l) => l.name === COUNTRIES.name)) {
      d.lists.push({ id: uid(), name: COUNTRIES.name, emoji: COUNTRIES.emoji, description: COUNTRIES.description, items: [...COUNTRIES.items], created: Date.now() });
    }
    d.seededCountries = true;
  }
  // Once: label each country with its continent (badges you already gave a country stay).
  if (!d.countryContinents) {
    const l = d.lists.find((x) => x.type !== "multi" && x.name === COUNTRIES.name);
    if (l) {
      const b = continentBadges();
      l.items.forEach((n) => { if (b[n] && !(l.badges && l.badges[n])) (l.badges = l.badges || {})[n] = b[n]; });
    }
    d.countryContinents = true;
  }
  // The Palworld Multiple, right after the Pokémon one.
  if (!d.seededPalworld) {
    if (!d.lists.some((l) => l.name === PALWORLD.name)) d.lists.splice(d.lists.findIndex((l) => l.name === POKEMON.name) + 1, 0, palworldMulti());
    d.seededPalworld = true;
  }
  // Once: the Palworld Multiple rolls 4 Passive Skills (it started with 1).
  if (!d.palPassives) {
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    const i = m ? m.cats.findIndex((c) => c.name === "Passive Skill") : -1;
    if (i >= 0) {
      Object.assign(m.cats[i], { name: "Passive Skill 1", unique: "passive" });
      m.cats.splice(i + 1, 0, ...palPassiveCats().slice(1));
      m.description = m.description.replace("passive skill and", "passive skills and");
    }
    d.palPassives = true;
  }
  // Once: the Palworld Multiple rolls how many Passive Skills (0–4) too, the Lucky passive
  // comes only with Lucky, and Pals like Gorirat always have their own.
  if (!d.palPassiveRules) {
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    const slots = m ? m.cats.filter((c) => /^Passive Skill [1-4]$/.test(c.name)) : [];
    slots.forEach((c) => {
      if (!c.items.includes(PAL_NONE)) c.items.unshift(PAL_NONE);
      if (c.notes && !c.notes[PAL_NONE]) c.notes = { [PAL_NONE]: "No passive skill in this slot", ...c.notes };
      c.fit = palPassiveFit(+c.name.slice(-1));
    });
    const count = slots.length && m.cats.find((c) => c.name === "Passive Skills");
    if (count) Object.assign(count, { fit: palCountCat().fit, starts: palCountCat().starts });
    else if (slots.length) m.cats.splice(m.cats.indexOf(slots[0]), 0, palCountCat());
    d.palPassiveRules = true;
  }
  // Once: the Palworld Multiple rolls Alpha (bigger, higher IV) and IV, before Lucky.
  if (!d.palAlpha) {
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    if (m && !m.cats.some((c) => c.name === "Alpha")) {
      const lucky = m.cats.findIndex((c) => c.name === "Lucky");
      m.cats.splice(lucky < 0 ? m.cats.length : lucky, 0, palAlphaCat(), ...(m.cats.some((c) => c.name === "IV") ? [] : [palIvCat()]));
      const size = m.cats.find((c) => c.name === "Size");
      if (size) size.grow = { ...PAL_GROW };
      m.description = m.description.replace(/passive skills and lucky$/, "passive skills, alpha, IV and lucky");
    }
    d.palAlpha = true;
  }
  // Once: Work Suitability shows a Pal's whole set, with levels.
  if (!d.palWork) {
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    const w = m && m.cats.find((c) => c.name === "Work Suitability");
    if (w) {
      const { items, fit, levels } = palWorkCat();
      Object.assign(w, { items, fit, levels });
      delete w.badges; delete w.notes; delete w.rare;
    }
    d.palWork = true;
  }
  // Once: Type shows a Pal's one or two types ("Dark · Fire"); what follows Type follows the pair.
  if (!d.palTypes) {
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    const named = (n) => m && m.cats.find((c) => c.name === n);
    if (named("Type")) {
      const { items, fit } = palTypeCat();
      Object.assign(named("Type"), { items, fit });
      const w = named("Work Suitability"), pa = named("Partner Ability");
      if (w && w.fit) w.fit.Type = palPairsBy(palTypeSet, palWorkSet);
      if (pa && pa.fit) pa.fit.Type = palPairsBy(palTypeSet, (n) => PALS[n][4]);
    }
    d.palTypes = true;
  }
  // Once: Partner Abilities and Passive Skills get labels (what they do; a passive's Gold or
  // Diamond tier). Labels you added yourself stay; the mount and glider words leave the descriptions.
  if (!d.palLabels4) {
    // Names this step used before (they got shorter; Stat Boost is now Combat).
    const PAL_OLD_LABELS = ["Type Boost","Stat Boost","Flying Mount","Water Mount","Active Skill","Pal Specific","Movement Boost","Exploration","Healing","Capture Boost","Base Worker","Egg Hatching","Ranch Drops","Item Drops","Carry Weight","Mining & Logging","EXP Boost","Sell Price"];
    const m = d.lists.find((l) => l.type === "multi" && l.name === PALWORLD.name);
    const relabel = (c, set) => {
      const auto = new Set([...Object.values(set).flat(), ...PAL_OLD_LABELS]);
      c.items.forEach((k) => {
        const own = ((c.badges && c.badges[k]) || []).filter((b) => !auto.has(b));
        setBadges(c, k, [...new Set([...(set[k] || []), ...own])]);
      });
    };
    const pa = m && m.cats.find((c) => c.name === "Partner Ability");
    if (pa) { pa.notes = { ...(pa.notes || {}), ...PAL_PARTNERS }; relabel(pa, PAL_PARTNER_BADGES); }
    (m ? m.cats.filter((c) => /^Passive Skill [1-4]$/.test(c.name)) : []).forEach((c) => relabel(c, PAL_PASSIVE_BADGES));
    const iv = m && m.cats.find((c) => c.name === "IV");
    if (iv && !iv.shine) iv.shine = structuredClone(PAL_IV_SHINE);
    // Habitat, right after Region.
    if (m && !m.cats.some((c) => c.name === "Habitat")) {
      const r = m.cats.findIndex((c) => c.name === "Region");
      m.cats.splice(r < 0 ? 1 : r + 1, 0, palHabitatCat());
    }
    d.palLabels4 = true;
  }
  // Once: give a Multiple's "Nature" category the stat effects of each nature.
  if (!d.natureBadges) {
    d.lists.forEach((l) => l.type === "multi" && l.cats.forEach((c) => {
      if (/^natures?$/i.test(c.name.trim()) && !c.badges) {
        const b = natureBadges(c.items);
        if (Object.keys(b).length) c.badges = b;
      }
    }));
    d.natureBadges = true;
  }
  // Once: give the Pokémon Multiple Habitat, Egg Group, Hidden Ability and Shiny (last, so
  // its reel stops last), and tie Type, Habitat and Egg Group to what they depend on.
  if (!d.pokemonCats) {
    const m = d.lists.find((l) => l.type === "multi" && /pok[eé]mon/i.test(l.name));
    if (m) {
      const named = (name) => m.cats.find((c) => c.name.trim().toLowerCase() === name.toLowerCase());
      const shiny = named("Shiny");
      if (!shiny) m.cats.push(shinyCat());
      else if (shiny.rare && shiny.rare.odds === 4096) Object.assign(shiny, rareYes()); // first tried at 1/4,096
      for (const name of ["Habitat", "Egg Group", "Hidden Ability"]) {
        if (!named(name)) m.cats.splice(m.cats.indexOf(named("Shiny")), 0, { id: uid(), name, items: [...POKEMON.cats[name]] });
      }
      for (const name in POKEMON_FIT) {
        const c = named(name);
        if (c) c.fit = structuredClone(POKEMON_FIT[name]);
      }
      if (/^Region, type, rarity, stage, form, nature(,| and) gender(, habitat)?(, egg group)?( and shiny)?$/.test(m.description)) m.description = POKEMON.description;
    }
    d.pokemonCats = true;
  }
  // Once: Hidden Ability is the abilities and what they do (it started as Yes/No), following Type.
  if (!d.hiddenAbilityFit) {
    d.lists.forEach((l) => l.type === "multi" && l.cats.forEach((c) => {
      if (!/^hidden abilit(y|ies)$/i.test(c.name.trim())) return;
      if (c.items.join() === "No,Yes") c.items = [...POKEMON.cats["Hidden Ability"]];
      if (!c.notes) c.notes = { ...HIDDEN_ABILITIES };
      if (!c.fit) c.fit = structuredClone(POKEMON_FIT["Hidden Ability"]);
    }));
    d.hiddenAbilityFit = true;
  }
  // Once: the Pokémon Type is one or two types ("Fire · Flying"); what follows Type follows the pair.
  if (!d.pokemonDualTypes) {
    const m = d.lists.find((l) => l.type === "multi" && /pok[eé]mon/i.test(l.name));
    const named = (name) => m && m.cats.find((c) => c.name.trim().toLowerCase() === name.toLowerCase());
    const type = named("Type");
    if (type) {
      type.items = [...POKEMON.cats.Type];
      type.fit = structuredClone(POKEMON_FIT.Type);
      for (const name of ["Habitat", "Egg Group", "Hidden Ability"]) {
        const c = named(name);
        if (c && c.fit && c.fit.Type) c.fit.Type = structuredClone(POKEMON_FIT[name].Type);
      }
    }
    d.pokemonDualTypes = true;
  }
  // Lists made before "Date created" existed count as created in their current order.
  const base = Date.now() - d.lists.length * 1000;
  d.lists.forEach((l, i) => { if (!l.created) l.created = base + i * 1000; });
  // Home: how lists are sorted, and which label they're filtered by.
  d.view = d.view || { sort: "custom", label: null };
  return d;
}

let db = load();
let fitMentions = new WeakMap(); // see `inFit`; edits always end in a save, which clears it
function save() {
  fitMentions = new WeakMap();
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Couldn't save on this device"); }
}
save();

const findList = (id) => db.lists.find((l) => l.id === id);

// A "Multiple" is a list of categories; each roll picks one option from every
// category: { type: "multi", cats: [{ id, name, link?, items }] }.
// `link` points at one of your normal lists: its options are used too (kept in
// sync), and `items` are extra options only this category has.
// `rare` { item, odds }: that option comes up 1 time in `odds`, and is celebrated.
// `fit` { "Other category": { "its option": ["options of this one that go with it"] } }.
// `notes` { "option": "what it means" }: shown with the option.
const isMulti = (l) => l.type === "multi";
const isRare = (c, v) => !!c.rare && c.rare.item === v;
// Rare enough for the gold celebration (`quiet` odds, like Alpha's 1 in 5, get none).
const isGold = (c, v) => isRare(c, v) && !c.rare.quiet;
const linkedList = (c) => {
  const l = c.link && findList(c.link);
  return l && !isMulti(l) ? l : null;
};
const catOptions = (c) => {
  const l = linkedList(c);
  return [...new Set([...(l ? l.items : []), ...c.items])];
};

/* =========================================================
   3. Random pick, history and the wheel
   ========================================================= */
function rand(n) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}

const today = () => new Date().toLocaleDateString("en-CA"); // e.g. 2026-10-17, local time

// The answer currently on screen. `rec` = it's already saved in history,
// so a reroll replaces it (history keeps what you ended on, not every roll).
// `spin` = show the wheel landing on it before showing the answer.
let cur = null;

function roll(list) {
  const p = list.items;
  cur.item = p.length ? p[rand(p.length)] : null;
  cur.spin = !!db.wheel;
  record(list);
}

function record(list) {
  const h = db.history[list.id] || (db.history[list.id] = []);
  const v = isMulti(list) ? (Object.keys(cur.picks).length ? { ...cur.picks } : null) : cur.item;
  if (cur.rec) h.shift();
  cur.rec = !!v;
  if (v) h.unshift(v);
  h.length = Math.min(h.length, 6);
  save();
}

// One option from a category: a rare option has its own odds, the rest share what's left.
function pickOption(c, o) {
  const rare = c.rare && o.includes(c.rare.item) ? c.rare : null;
  if (!rare) return o[rand(o.length)];
  const rest = o.filter((x) => x !== rare.item);
  return !rest.length || rand(rare.odds) === 0 ? rare.item : rest[rand(rest.length)];
}

// Multiple: re-pick every category except the locked ones. With `keepValid`
// (a category changed while editing) only the missing or outdated ones are
// picked, without the reels.
function rollCombo(list, keepValid) {
  const before = cur.picks, live = liveCats(list);
  const kept = live.filter((c) => (keepValid || cur.locks.has(c.id)) && catOptions(c).includes(before[c.id]));
  const todo = fitOrder(live.filter((c) => !kept.includes(c)));
  let picks, tries = 0;
  // Each pick follows the ones before it; locks can leave a dead end, so try again if so.
  do {
    picks = Object.fromEntries(kept.map((c) => [c.id, before[c.id]]));
    for (const c of todo) picks[c.id] = pickOption(c, fitOptions(list, c, catOptions(c), picks));
  } while (++tries < 30 && !live.every((c) => fits(list, c, picks[c.id], picks)));
  startsFirst(list, picks, todo);
  todo.forEach((c) => cur.locks.delete(c.id));
  cur.before = before;
  cur.picks = picks;
  rollLevels(list, !keepValid);
  cur.spin = !keepValid && !!db.wheel;
  record(list);
}
// Categories in play: switched on (`off` is set in Edit) and with something to pick.
const liveCats = (list) => list.cats.filter((c) => !c.off && catOptions(c).length);
// Does `v` of `other`'s table go with `pick`? A pick with no row, or an option the
// table never mentions (one you added yourself), goes with anything.
const inFit = (table, pick, v) => {
  if (!table[pick] || table[pick].includes(v)) return true;
  if (!fitMentions.has(table)) fitMentions.set(table, new Set(Object.values(table).flat()));
  return !fitMentions.get(table).has(v);
};
// `grow`: when another category lands on one option (Alpha: Yes), this one is a step further
// along its options (Size S → M; the last one stays). Its rules still go by the usual value,
// so these are the usual values it could have come from (none for the first option).
const grown = (list, g, val) => {
  const by = list.cats.find((x) => x.name === g.grow.by && !x.off);
  return !!by && val(by) === g.grow.when;
};
function usualVals(list, x, val) {
  const p = val(x);
  if (!x.grow || !grown(list, x, val)) return [p];
  const o = x.items, i = o.indexOf(p);
  return i < 0 ? [p] : i === o.length - 1 ? o.slice(-2) : i ? [o[i - 1]] : [];
}
// Does `a` go with `b` by a's table for b?
function pairFits(list, a, b, val) {
  const t = a.fit && a.fit[b.name];
  if (!t) return true;
  if (!a.grow && !b.grow) return inFit(t, val(b), val(a));
  const bs = usualVals(list, b, val);
  return usualVals(list, a, val).some((x) => bs.some((y) => inFit(t, y, x)));
}
// Does option `v` of category `c` go with the picks so far (both ways round)?
function fits(list, c, v, picks) {
  const val = (x) => (x === c ? v : picks[x.id]);
  const withAll = (x) => (!x.grow || usualVals(list, x, val).length) &&
    list.cats.every((d) => d === x || val(d) == null || (pairFits(list, x, d, val) && pairFits(list, d, x, val)));
  return list.cats.every((d) => {
    if (d === c || picks[d.id] == null) return true;
    if (c.unique && c.unique === d.unique && picks[d.id] === v && v !== PAL_NONE) return false; // e.g. the same Passive Skill twice
    return pairFits(list, c, d, val) && pairFits(list, d, c, val);
  }) && (!c.grow || usualVals(list, c, val).length > 0)
    // Alpha changes what Size has to be, so check the categories that grow with it.
    && list.cats.every((g) => !g.grow || g === c || g.grow.by !== c.name || val(g) == null || withAll(g))

// A category's `starts` lists what its group must hold, by other picks (Lucky → the Lucky
// passive, Gorirat → Hooligan), in that order.
const startsCat = (list) => list.cats.find((x) => x.starts && x.starts.by);
const startsNeed = (list, s, pick) => Object.entries(s.starts.by).flatMap(([name, rows]) => {
  const d = list.cats.find((x) => x.name === name && !x.off);
  return (d && pick(d) != null && rows[pick(d)]) || [];

// Each one must be in the group already or still have an open slot to land in.
function startsFit(list, c, v, picks) {
  const s = startsCat(list);
  if (!s || (c !== s && c.unique !== s.starts.group && !s.starts.by[c.name])) return true;
  const pick = (d) => (d === c ? v : picks[d.id]);
  const need = new Set(startsNeed(list, s, pick));
  if (!need.size) return true;
  let open = 0, held = 0;
  list.cats.forEach((d) => {
    if (d.off || d.unique !== s.starts.group) return;
    const p = pick(d);
    if (p == null) open++;
    else { need.delete(p); if (p !== PAL_NONE) held++; }

  return need.size <= Math.min(open, Number.isFinite(count) ? count - held : open);

// Rolled ones come first in the group, in `starts` order; the rest keep their places.
function startsFirst(list, picks, rolled) {
  const s = startsCat(list);

  const need = startsNeed(list, s, (d) => picks[d.id]);
  const slots = rolled.filter((d) => d.unique === s.starts.group && picks[d.id] != null && picks[d.id] !== PAL_NONE);
  const rank = (p) => (need.includes(p) ? need.indexOf(p) : need.length);
  const vals = slots.map((d) => picks[d.id]).sort((a, b) => rank(a) - rank(b));

const fitOptions = (list, c, o, picks) => {
  const good = o.filter((v) => fits(list, c, v, picks));
  return good.length ? good : o;
};
// What Pick by hand offers: options that go with the locked results, and that leave every
// other category something to land on (e.g. no two locks that no single Type fits).
function fitChoices(list, c, locked) {
  const others = liveCats(list).filter((d) => d !== c && locked[d.id] == null);
  const good = catOptions(c).filter((v) => {
    const p = { ...locked, [c.id]: v };
    return fits(list, c, v, locked) && others.every((d) => catOptions(d).some((x) => fits(list, d, x, p)));

// Categories in picking order: each one after the categories its `fit` depends on.

    if (r.includes(old)) r[r.indexOf(old)] = v;

  list.cats.forEach((d) => {
    const t = d.fit && d.fit[c.name];
    if (t && t[old] && v !== old) { t[v] = t[old]; delete t[old]; }
    if (d.grow && d.grow.by === c.name && d.grow.when === old) d.grow.when = v;
    const lv = d.levels;
    if (lv && lv.by === c.name && lv.base[old] && v !== old) { lv.base[v] = lv.base[old]; delete lv.base[old]; }
    if (lv && lv.bonus && lv.bonus[c.name] === old) lv.bonus[c.name] = v;
    const st = d.starts && d.starts.by;
    if (st && st[c.name] && st[c.name][old] && v !== old) { st[c.name][v] = st[c.name][old]; delete st[c.name][old]; }
    if (st && c.unique === d.starts.group) Object.values(st).forEach((t2) => Object.values(t2).forEach((r) => {

// `levels`: the option is a set of skills ("Handiwork · Lumbering"), each shown with a level:
// its usual one for the pick of `by` (from `base`, else 1), plus a boost where each extra
// step is half as likely as the last, plus 1 for each `bonus` that came up, up to `max`.
// `fresh` rolls new levels for unlocked ones; otherwise they change only with what they hang on.
function rollLevels(list, fresh) {

  liveCats(list).forEach((c) => {
    if (!c.levels) return;
    const L = c.levels, v = cur.picks[c.id], by = named(L.by);
    const base = (by && L.base[cur.picks[by.id]]) || {};
    const bonus = Object.entries(L.bonus || {}).filter(([n, w]) => { const d = named(n); return d && cur.picks[d.id] === w; }).length;
    // Alpha or Lucky picked by hand keeps the rolled levels and only adds its bonus.
    const sig = JSON.stringify([v, by ? cur.picks[by.id] : null]);
    let lv = cur.levels[c.id];
    if (!lv || lv.sig !== sig || (fresh && !cur.locks.has(c.id))) {
      const skills = v == null || v === PAL_NONE ? [] : String(v).split(" · ");
      lv = { sig, rolled: skills.map((s) => {
        let n = Math.max(1, base[s] || 1);
        while (n < L.max && rand(2) === 0) n++;
        return [s, n];
      }) };
    }
    lv.shown = lv.rolled.map(([s, n]) => [s, Math.min(L.max, n + bonus)]);

// An empty passive slot (or a Pal with no work) shows "-".
const isEmptyVal = (c, v) => v === PAL_NONE && !!(c.unique || c.levels);
const emptyOr = (c, v) => (isEmptyVal(c, v) ? "-" : v);

const shownVal = (me, c, v) => emptyOr(c, c.levels && me.levels && me.levels[c.id] && me.picks[c.id] === v ? me.levels[c.id].text : v);

const shineOf = (c, v) => (c.shine && c.shine.gold && c.shine.gold.includes(v) ? "gold" : c.shine && c.shine.silver && c.shine.silver.includes(v) ? "silver" : "");

const levelChips = (me, c) => {

// After a pick by hand: re-pick unlocked categories that no longer go with it. Returns their names.

  const s = startsCat(list);
  const fixedFor = (c) => {
    // Followers: by `fit`, by `grow` (Size after Alpha), and the Passive Skills after the Pal or Lucky (`starts`).
    const follower = (id) => {
      const d = list.cats.find((x) => x.id === id);
      return !!d && !!((d.fit && d.fit[c.name]) || (d.grow && d.grow.by === c.name) ||
        (s && s.starts.by[c.name] && (d === s || d.unique === s.starts.group)));
    };
    return Object.fromEntries(Object.entries(cur.picks).filter(([id]) => cur.locks.has(id) || !follower(id)));
  };
  const repick = (c) => { cur.picks[c.id] = pickOption(c, fitOptions(list, c, catOptions(c), fixedFor(c))); };
  const allFit = () => live.every((c) => fits(list, c, cur.picks[c.id], cur.picks));

  free.forEach((c) => fits(list, c, cur.picks[c.id], fixedFor(c)) || repick(c));
  // Locks can leave a dead end (e.g. a Region with no fitting Type): re-pick everything related.
  const related = free.filter((c) => c.fit || c.grow || live.some((d) => (d.fit && d.fit[c.name]) || (d.grow && d.grow.by === c.name)));

  // stays), then everything related.
  const leads = (c) => !c.fit && !c.grow && !(s && (c === s || c.unique === s.starts.group));
  for (let tries = 0; tries < 30 && !allFit(); tries++) {
    const redo = tries < 10 ? related.filter((c) => !leads(c)) : related;
    redo.forEach((c) => delete cur.picks[c.id]);
    redo.forEach((c) => { cur.picks[c.id] = pickOption(c, fitOptions(list, c, catOptions(c), cur.picks)); });

};

// The wheel: one slice per item, drawn in a 300×300 box, first slice at the top.
// Slices are spun inside a static gold rim of marquee bulbs.
const SPIN_MS = 4000;
const WHEEL_COLORS = ["#E63946", "#FFC300", "#2667FF", "#FF7A00", "#8E3CCB", "#1E9E5A"]; // matches .c0–.c5
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function wheelSVG(items) {
  const n = items.length, R = 150, s = 360 / n, P = WHEEL_COLORS.length;
  const pt = (deg, r) => {
    const a = ((deg - 90) * Math.PI) / 180;
    return `${(R + r * Math.cos(a)).toFixed(2)} ${(R + r * Math.sin(a)).toFixed(2)}`;
  };
  const font = n <= 8 ? 15 : n <= 16 ? 13 : 11;
  const max = n <= 8 ? 16 : 14; // longer names are cut with …
  const slices = items.map((it, i) => {
    // Cycle the colors; the last slice must not match the first one next to it.
    let c = i % P;
    if (n > 1 && i === n - 1 && c === 0) c = (n - 2) % P === 1 ? 2 : 1;
    const label = it.length > max ? it.slice(0, max - 1) + "…" : it;
    return `
      <g class="c${c}" data-i="${i}">
        <path class="sh" d="M${R} ${R} L${pt(i * s, R)} A${R} ${R} 0 0 1 ${pt((i + 1) * s, R)} Z"/>
        <text x="${2 * R - 14}" y="${R}" transform="rotate(${(i + 0.5) * s - 90} ${R} ${R})" font-size="${font}" text-anchor="end" dominant-baseline="central">${esc(label)}</text>
      </g>`;
  }).join("");
  const bulbs = Array.from({ length: 24 }, (_, i) => {
    const a = (i * 15 * Math.PI) / 180;
    return `<circle class="bulb" cx="${(R + 141 * Math.cos(a)).toFixed(2)}" cy="${(R + 141 * Math.sin(a)).toFixed(2)}" r="4.5"/>`;
  }).join("");
  return `
    <div class="wheel" role="img" aria-label="Spinning the wheel">
      <div class="wheel-rays"></div>
      <div class="wheel-glow"></div>
      <svg class="wheel-disc" viewBox="0 0 300 300" aria-hidden="true">${slices}</svg>
      <svg class="wheel-frame" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFE7A0"/><stop offset="0.5" stop-color="#E0A100"/><stop offset="1" stop-color="#9C6400"/>
          </linearGradient>
        </defs>
        <circle cx="150" cy="150" r="141" fill="none" stroke="url(#gold)" stroke-width="18"/>
        <g>${bulbs}</g>
        <circle cx="150" cy="150" r="22" fill="url(#gold)" stroke="#9C6400" stroke-width="2"/>
        <text x="150" y="151" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#E63946">★</text>
      </svg>
      <svg class="wheel-pointer" viewBox="0 0 52 40" aria-hidden="true">
        <path d="M2 20 L34 5 A16 16 0 1 1 34 35 Z" fill="#E63946" stroke="#FFE7A0" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="36" cy="20" r="6" fill="#FFE7A0"/>
      </svg>
    </div>`;
}

// Sound effects, made in the browser (no audio files).
let actx;
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function tone(freq, at, dur, type = "triangle", vol = 0.15, toFreq) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
const sfx = {
  start: () => tone(180, 0, 0.45, "sawtooth", 0.06, 900), // whoosh up
  tick: () => tone(1500 + Math.random() * 300, 0, 0.035, "square", 0.04),
  win: () => {
    // Circus "ta-da": quick arpeggio up to a held chord, plus a sparkle on top.
    [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.09, 0.18, "square", 0.07));
    [1046.5, 1318.5, 1568].forEach((f) => tone(f, 0.27, 0.8, "triangle", 0.1));
    [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, 0.35 + i * 0.06, 0.12, "sine", 0.05));
  },
  rare: () => {
    // A glittering run up to a long, warm chord, with more sparkle over it.
    [1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => tone(f, i * 0.07, 0.35, "sine", 0.09));
    [523.25, 659.25, 783.99, 1046.5].forEach((f) => tone(f, 0.4, 1.4, "triangle", 0.1));
    [2093, 2637, 3136, 4186, 5274].forEach((f, i) => tone(f, 0.55 + i * 0.09, 0.25, "sine", 0.05));
  },
};

// A rare option came up: golden flash and rays, its name, and sparkles flying out.
function goldBurst(c) {
  const box = document.createElement("div");
  box.className = "gold-burst";
  box.setAttribute("role", "status");
  box.innerHTML = `<div class="gold-flash"></div><div class="gold-rays"></div><p class="gold-title">✨ ${esc(c.name)}! ✨</p>`;
  if (!reducedMotion()) {
    for (let k = 0; k < 70; k++) {
      const p = document.createElement("i");
      p.textContent = "✦";
      p.style.fontSize = 10 + Math.random() * 18 + "px";
      box.append(p);
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 300;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      p.animate([
        { transform: "translate(-50%, -50%) scale(0.2)", opacity: 0 },
        { transform: `translate(${dx}px, ${dy}px) scale(1)`, opacity: 1, offset: 0.35 },
        { transform: `translate(${dx * 1.2}px, ${dy + 160}px) scale(0.5) rotate(180deg)`, opacity: 0 },
      ], { duration: 1800 + Math.random() * 1400, delay: Math.random() * 500, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", fill: "both" });
    }
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 3700);
  sfx.rare();
  if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 120]);
}

// Confetti bursting out of the wheel's center.
function confetti(from) {
  const r = from.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const box = document.createElement("div");
  box.className = "confetti";
  for (let k = 0; k < 60; k++) {
    const p = document.createElement("i");
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.background = WHEEL_COLORS[k % WHEEL_COLORS.length];
    box.append(p);
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 180, spinDeg = (Math.random() - 0.5) * 1080;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
    p.animate([
      { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy - 60}px) rotate(${spinDeg / 2}deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${dx * 1.3}px, ${dy + 320}px) rotate(${spinDeg}deg)`, opacity: 0 },
    ], { duration: 1400 + Math.random() * 700, easing: "cubic-bezier(0.2, 0.6, 0.4, 1)", fill: "forwards" });
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 2300);
}

// Spin so the picked item's slice stops at the pointer: click as each slice
// passes, then lights, fanfare and confetti while zooming in on the winner,
// zoom the wheel out and show the answer.
function spin(list) {
  const wheel = $(".wheel"), disc = $(".wheel-disc"), pointer = $(".wheel-pointer");
  const i = list.items.indexOf(cur.item), s = 360 / list.items.length;
  // Slice centers are measured clockwise from 12 o'clock; the pointer is at 3 o'clock (90°).
  const turn = 360 * 6 + 90 - (i + 0.5) * s + (Math.random() - 0.5) * 0.7 * s;
  const me = cur, token = (cur.spinToken = {});
  const done = () => cur === me && me.spinToken === token;

  wheel.classList.add("spinning");
  sfx.start();
  const anim = disc.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${turn}deg)` }],
    { duration: SPIN_MS, easing: "cubic-bezier(0.15, 0.85, 0.15, 1)", fill: "forwards" });

  // Which slice is under the pointer right now; click and flick the pointer when it changes.
  let under = 0, lastTick = 0;
  (function watch() {
    if (!done() || anim.playState === "finished") return;
    const m = new DOMMatrix(getComputedStyle(disc).transform);
    const deg = ((Math.atan2(m.b, m.a) * 180) / Math.PI + 360) % 360;
    const now = Math.floor((((90 - deg) % 360) + 360) % 360 / s);
    if (now !== under && performance.now() - lastTick > 30) {
      under = now;
      lastTick = performance.now();
      sfx.tick();
      pointer.animate([{ transform: "rotate(-18deg)" }, { transform: "rotate(0deg)" }], { duration: 120, easing: "ease-out" });
    }
    requestAnimationFrame(watch);
  })();

  anim.finished.then(() => {
    if (!done()) return;
    wheel.classList.replace("spinning", "won");
    disc.querySelector(`[data-i="${i}"]`).classList.add("win");
    sfx.win();
    confetti(wheel);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    // Zoom in on the winning slice's label (right half of the wheel, by the
    // pointer) so it can be read, hold, then zoom back out.
    const close = "translateX(-43%) scale(1.8)";
    wheel.animate([{ transform: "none" }, { transform: close }], { duration: 650, easing: "cubic-bezier(0.3, 1.25, 0.5, 1)", fill: "forwards" });
    setTimeout(() => {
      if (!done()) return;
      wheel.animate([{ transform: close, opacity: 1 }, { transform: "scale(0.3)", opacity: 0 }], { duration: 320, easing: "ease-in", fill: "forwards" })
        .finished.then(() => {
          if (!done()) return;
          me.spin = false;
          me.reveal = true;
          if (route().view === "list") render();
        }, () => {});
    }, 2000);
  }, () => {});
}

// Multiple with the toggle on: a slot machine with one reel per unlocked
// category. Reels start on the last answer, spin and stop one by one, top
// to bottom, inside a gold marquee frame, then fanfare and the answer.
const sfxStop = () => tone(320, 0, 0.09, "square", 0.07, 140); // reel "clunk"

function placeBulbs(el) {
  const w = el.offsetWidth, h = el.offsetHeight, m = 7, gap = 22;
  const nx = Math.max(2, Math.round((w - 2 * m) / gap)), ny = Math.max(2, Math.round((h - 2 * m) / gap));
  const pts = [];
  for (let i = 0; i < nx; i++) pts.push([m + ((w - 2 * m) * i) / nx, m]);
  for (let i = 0; i < ny; i++) pts.push([w - m, m + ((h - 2 * m) * i) / ny]);
  for (let i = 0; i < nx; i++) pts.push([w - m - ((w - 2 * m) * i) / nx, h - m]);
  for (let i = 0; i < ny; i++) pts.push([m, h - m - ((h - 2 * m) * i) / ny]);
  el.innerHTML = pts.map(([x, y]) => `<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></i>`).join("");
}

function slotSpin(list, reels) {
  const box = $(".slots"), me = cur, token = (cur.spinToken = {});
  const done = () => cur === me && me.spinToken === token;
  placeBulbs($(".bulbs"));
  box.classList.add("spinning");
  sfx.start();

  const runs = reels.map((c, k) => {
    const win = $(`.reel[data-cat="${c.id}"]`), strip = win.firstElementChild, h = win.offsetHeight;
    const o = catOptions(c), pick = me.picks[c.id], other = () => o.find((x) => x !== pick);
    const seq = [o.includes(me.before[c.id]) ? me.before[c.id] : o[rand(o.length)]];
    const len = 14 + k * 5;
    while (seq.length < len - 1) {
      let x;
      do x = o[rand(o.length)]; while (x === seq[seq.length - 1]);
      seq.push(x);
    }
    if (seq[seq.length - 1] === pick) seq[seq.length - 1] = other();
    seq.push(pick, other()); // the one after shows in the little bounce
    strip.innerHTML = seq.map((x, i) => `<span>${esc(i === len - 1 ? shownVal(me, c, x) : emptyOr(c, x))}</span>`).join("");
    const anim = strip.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-(len - 1) * h}px)` }],
      { duration: 1500 + k * 550, easing: "cubic-bezier(0.25, 0.75, 0.3, 1.04)", fill: "forwards" });
    anim.finished.then(() => {
      if (!done()) return;
      sfxStop();
      win.closest(".combo-row").classList.add("landed");
      if (navigator.vibrate) navigator.vibrate(8);
    }, () => {});
    return { strip, h, anim, at: 0 };
  });

  // Click as options pass under each reel's window.
  let lastTick = 0;
  (function watch() {
    if (!done()) return;
    let moving = false;
    for (const r of runs) {
      if (r.anim.playState === "finished") continue;
      moving = true;
      const at = Math.round(-new DOMMatrix(getComputedStyle(r.strip).transform).f / r.h);
      if (at !== r.at) {
        r.at = at;
        if (performance.now() - lastTick > 35) { lastTick = performance.now(); sfx.tick(); }
      }
    }
    if (moving) requestAnimationFrame(watch);
  })();

  Promise.all(runs.map((r) => r.anim.finished)).then(() => {
    if (!done()) return;
    box.classList.replace("spinning", "won");
    const hits = reels.filter((c) => isGold(c, me.picks[c.id]));
    if (hits.length) {
      hits.forEach((c) => $(`.combo-row[data-cat="${c.id}"]`).classList.add("gold"));
      goldBurst(hits[0]);
      me.goldShown = true; // the screen after the reels only keeps the glow
    } else {
      sfx.win();
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    }
    confetti(box);
    box.animate([{ transform: "scale(1)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: 500, easing: "cubic-bezier(0.3, 1.5, 0.5, 1)" });
    setTimeout(() => {
      if (!done()) return;
      box.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(0.92)" }], { duration: 220, easing: "ease-in", fill: "forwards" })
        .finished.then(() => {
          if (!done()) return;
          me.spin = false;
          me.reveal = true;
          if (route().view === "list") render();
        }, () => {});
    }, 1500);
  }, () => {});
}

const depth = () => (history.state && history.state.d) || 0;

}

// Labels: your own tags on a list (e.g. "Food", "Weekend"), shown as little
// colored pills. Each label always gets the same color, picked from its name.
const labelHue = (s) => [...s.toLowerCase()].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const labelPill = (s) => `<span class="pill-label" style="--h:${labelHue(s)}">${esc(s)}</span>`;
const allLabels = (lists = db.lists) => [...new Set(lists.flatMap((l) => l.labels || []))].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
const labelsField = (l) => `
  <div class="label">Labels</div>
  <button class="input labels-in" data-act="labelSheet" aria-label="Edit labels">
    ${(l.labels || []).map(labelPill).join("")}<span class="labels-add">${l.labels && l.labels.length ? "Edit" : "+ Add a label"}</span>
  </button>`;

I.tag = ic("M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z|M7 7h.01", 18);

// Option badges: little notes on one option, e.g. Adamant → "+10% Atk", "−10% SpA".
// Kept on whatever holds the options (a list, or a Multiple's category) as
// `badges: { "Adamant": ["+10% Atk", "−10% SpA"] }`.
// Badges starting with + are green and with − red; others get a color from their text.
const badgesOf = (owner, item) => (owner && owner.badges && owner.badges[item]) || [];
// A category's option can also carry badges from its linked list.
const optionBadges = (list, cat, item) =>
  cat ? [...new Set([...badgesOf(cat, item), ...badgesOf(linkedList(cat), item)])] : badgesOf(list, item);
// An option's description, if it has one.
const optionNote = (owner, item) => (owner && owner.notes && owner.notes[item] ? `<span class="opt-note">${esc(owner.notes[item])}</span>` : "");
const BADGE_HUES = { Gold: 45, Diamond: 190 };
const badgeHue = (s) => (/^\+/.test(s) ? 140 : /^[−-]/.test(s) ? 0 : BADGE_HUES[s] ?? labelHue(s));
const badgePills = (arr, cls = "") => arr.length
  ? `<span class="badges ${cls}">${arr.map((b) => `<span class="pill-label${b === "Rainbow" ? " rainbow" : ""}" style="--h:${badgeHue(b)}">${esc(b)}</span>`).join("")}</span>`
  : "";
const allBadges = (owner) => [...new Set(Object.values((owner && owner.badges) || {}).flat())].sort((a, b) => a.localeCompare(b));
function setBadges(owner, item, arr) {
  if (arr.length) (owner.badges = owner.badges || {})[item] = arr;
  else if (owner.badges) delete owner.badges[item];
  if (owner.badges && !Object.keys(owner.badges).length) delete owner.badges;
}

// A list's icon: your uploaded image if it has one, otherwise its emoji.
const icon = (l) => (l.image ? `<img class="icon-img" src="${esc(l.image)}" alt="">` : esc(l.emoji));
// Small corner badge on a Multiple's emoji, so it stands out from normal lists.
const emojiBox = (l) => `<span class="emoji">${icon(l)}${isMulti(l) ? `<span class="badge" aria-label="Multiple">${I.layersSm}</span>` : ""}</span>`;
const grip = `<span class="grip" aria-hidden="true">${I.grip}</span>`;

function render() {
  const r = route();
  if (r.view === "home" || r.view === "manage") cur = null;

  if (r.view === "list" || r.view === "edit" || r.view === "cat") {
    const list = findList(r.id);
    if (!list) { history.replaceState({ d: depth() }, "", "#/"); return render(); }
    const multi = isMulti(list);
    if (r.view === "cat") {
      const cat = multi && list.cats.find((c) => c.id === r.sub);
      if (!cat) { history.replaceState({ d: depth() }, "", "#/edit/" + list.id); return render(); }
      renderCatEdit(list, cat);
    } else if (r.view === "list") {
      multi ? renderCombo(list) : renderResult(list);
    } else {
      multi ? renderMultiEdit(list) : renderEdit(list);
    }
  } else if (r.view === "manage") {
    renderManage();
  } else {
    renderHome();
  }
  renderSheet();
}

// Home search box text (kept while the app is open, not saved).
let homeQuery = "";
const SORTS = { custom: "My order", az: "A–Z", new: "Newest", old: "Oldest" };

// The lists Home shows: filtered by the chosen label and search text, then sorted.
function homeLists() {
  const v = db.view, q = homeQuery.trim().toLowerCase();
  let ls = db.lists.filter((l) => !l.off &&
    (!v.label || (l.labels || []).includes(v.label)) &&
    (!q || [l.name, l.description || "", ...(l.labels || [])].some((s) => s.toLowerCase().includes(q))));
  if (v.sort === "az") ls = [...ls].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true }));
  else if (v.sort === "new") ls = [...ls].sort((a, b) => b.created - a.created);
  else if (v.sort === "old") ls = [...ls].sort((a, b) => a.created - b.created);
  return ls;
}
// Drag to reorder only makes sense when every list is showing in your own order.
const canReorder = () => (db.view.sort || "custom") === "custom" && !db.view.label && !homeQuery.trim();

// Just the rows, so typing in the search box doesn't redraw (and unfocus) it.
function fillHomeList() {
  const box = $("#homeList");
  if (!box) return;
  const ls = homeLists(), sortable = canReorder();
  const rows = ls.map((l) => {
    const pills = (l.labels || []).map(labelPill).join("");
    return `
      <button class="row" data-act="open" data-id="${l.id}">
        ${emojiBox(l)}
        <span class="row-text">
          <div class="row-name">${esc(l.name)}</div>
          ${pills || l.description ? `<div class="row-sub">${pills}${esc(l.description || "")}</div>` : ""}
        </span>
        <span class="count">${isMulti(l) ? l.cats.length : l.items.length}</span>
        ${sortable ? grip : ""}
      </button>`;
  }).join("");
  box.innerHTML = ls.length
    ? `<div class="group"${sortable ? ' data-sort="lists"' : ""}>${rows}</div>`
    : db.lists.every((l) => l.off)
    ? `<div class="no-match"><p class="hint">All lists are hidden.</p><button class="pill" data-act="openManage">Edit lists</button></div>`
    : `<div class="no-match"><p class="hint">No lists match${homeQuery.trim() ? ` “${esc(homeQuery.trim())}”` : ""}.</p><button class="pill" data-act="clearFilters">Clear search and filter</button></div>`;
}

function renderHome() {
  const labels = allLabels(db.lists.filter((l) => !l.off));
  if (db.view.label && !labels.includes(db.view.label)) db.view.label = null; // that label is gone
  const chips = labels.length ? `
    <div class="chips-row" role="toolbar" aria-label="Filter by label">
      <button class="chip${db.view.label ? "" : " on"}" data-act="filterLabel" data-v="">All</button>
      ${labels.map((s) => `<button class="chip${db.view.label === s ? " on" : ""}" data-act="filterLabel" data-v="${esc(s)}" style="--h:${labelHue(s)}"><i></i>${esc(s)}</button>`).join("")}
    </div>` : "";

  app.innerHTML = `
    <main class="view">
      <header class="head">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8.3" cy="8.3" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="15.7" cy="15.7" r="1.7" fill="currentColor"/></svg>
        </span>
        <div class="head-text">
          <h1>Randomizer</h1>
          <p class="tagline">Tap a list, get an answer.</p>
        </div>
        <button class="iconbtn" data-act="menu" aria-label="Menu">${I.more}</button>
      </header>
      ${db.lists.length ? `
      <div class="toolbar">
        <label class="search">
          ${I.search}
          <input type="search" id="search" value="${esc(homeQuery)}" placeholder="Search lists" aria-label="Search lists" autocomplete="off" enterkeyhint="search">
        </label>
        <button class="pill sortbtn" data-act="sortSheet" aria-label="Sort: ${SORTS[db.view.sort || "custom"]}">${I.sort}${SORTS[db.view.sort || "custom"]}</button>
      </div>
      ${chips}
      <div id="homeList"></div>`
        : `<p class="hint">No lists yet.</p><button class="btn ghost" data-act="newPick">+ New list</button>`}
      <button class="fab" data-act="newPick" aria-label="New randomizer"><span class="fab-plus">${I.plus}</span><span class="fab-trash">${I.trash}</span></button>
    </main>`;
  fillHomeList();
}

function renderResult(list) {
  if (!cur || cur.id !== list.id) {
    cur = { id: list.id, item: null, rec: false };
    roll(list);
  } else if (cur.item && !list.items.includes(cur.item)) {
    roll(list); // item was renamed or deleted while editing
  }

  // No point spinning a wheel with one slice, and skip it if the phone asks for less motion.
  if (cur.spin && (list.items.length < 2 || reducedMotion())) cur.spin = false;
  const spinning = cur.spin;
  const size = (s) => (s.length <= 12 ? "s" : s.length <= 26 ? "m" : "l");

  let stage;
  if (!list.items.length) {
    stage = `
      <p class="empty-title">This list is empty</p>
      <p class="empty-text">Add a few options first.</p>
      <button class="btn primary sm" data-act="edit">Add items</button>`;
  } else if (spinning) {
    stage = wheelSVG(list.items);
  } else {
    stage = `<button class="answer ${size(cur.item)}${cur.reveal ? " reveal" : ""}" data-act="copyResult">${esc(cur.item)}</button>` +
      badgePills(badgesOf(list, cur.item), `answer-badges${cur.reveal ? " reveal" : ""}`) +
      `<p class="copy-hint">Tap to copy</p>`;
    cur.reveal = false;
  }

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title"><span class="top-icon">${icon(list)}</span><span class="ellip">${esc(list.name)}</span></div>
        <button class="iconbtn" data-act="edit" aria-label="Edit list">${I.edit}</button>
      </div>
      <section class="stage${spinning ? " spin" : ""}" aria-live="polite">${stage}</section>
      ${list.items.length ? `
      <div class="actions">
        <button class="linkbtn" data-act="pick" ${spinning ? 'aria-disabled="true"' : ""}>${I.hand} Pick by hand</button>
        <div class="btn-row">
          <button class="btn toggle" data-act="wheel" role="switch" aria-checked="${!!db.wheel}"><span class="switch" aria-hidden="true"></span> Wheel</button>
          <button class="btn primary" data-act="reroll" ${spinning ? 'aria-disabled="true"' : ""}>${I.reroll} Reroll</button>
        </div>
      </div>` : ""}
    </main>`;
  if (spinning) spin(list);
}

// The slots of the `starts` group (e.g. Passive Skill 1–4) among `cats`, with their count category:
// { name, count, members }, or null when there aren't at least two of them.
function comboGroup(list, cats) {
  const s = startsCat(list);
  const members = s ? cats.filter((c) => c.unique === s.starts.group) : [];
  if (members.length < 2) return null;
  return { name: s.name, count: cats.includes(s) ? s : null, members };
}

// Multiple: one row per category with its pick. Tap a row to choose it
// yourself; the lock keeps it when you reroll (until you leave this screen).
function renderCombo(list) {
  if (!cur || cur.id !== list.id) {
    cur = { id: list.id, picks: {}, locks: new Set(), hidden: new Set(), rec: false };
    rollCombo(list);
  } else if (comboStale(list)) {
    rollCombo(list, true); // a category changed while editing
  }

  const live = liveCats(list);
  // Hidden categories (until you leave this screen) still roll, so linked ones stay right.
  const shown = live.filter((c) => !cur.hidden.has(c.id));
  const reels = shown.filter((c) => !cur.locks.has(c.id) && catOptions(c).length > 1);
  if (cur.spin && (!reels.length || reducedMotion())) cur.spin = false;
  const spinning = cur.spin;
  const off = spinning ? 'aria-disabled="true"' : "";
  // Rare options on show (one still on its reel hasn't landed yet).
  const gold = shown.filter((c) => isGold(c, cur.picks[c.id]) && !(spinning && reels.includes(c)));

  // A group of slots with a count (Palworld's Passive Skills) shows as one row: the ones that
  // came up, each tappable, and one lock for all. The count is not shown on its own.
  const g = comboGroup(list, shown);
  const filled = g ? g.members.filter((c) => !isEmptyVal(c, cur.picks[c.id])) : [];
  const fills = (c) => !isEmptyVal(c, cur.picks[c.id]);
  // While spinning, the group's reels are the slots that land on a passive (or the first slot if none do).
  let gReels = g ? g.members.filter((c) => reels.includes(c) && fills(c)) : [];
  if (g && !filled.length && reels.includes(g.members[0])) gReels = [g.members[0]];
  const spinReels = reels.filter((c) => !g || (c !== g.count && (!g.members.includes(c) || gReels.includes(c))));
  const reelOf = (c) => `<span class="combo-val reel" data-cat="${c.id}"><span class="strip"><span>${esc(shownVal(cur, c, cur.picks[c.id]))}</span></span></span>`;
  const groupRow = (k) => {
    const ids = [...g.members, ...(g.count ? [g.count] : [])].map((c) => c.id);
    const allLocked = g.members.every((c) => cur.locks.has(c.id));
    const some = g.members.some((c) => cur.locks.has(c.id));
    const seen = spinning ? g.members.filter((c) => gReels.includes(c) || (!reels.includes(c) && fills(c))) : filled;
    const subs = seen.map((c) => {
      const v = cur.picks[c.id];
      const lockMark = some && !allLocked && cur.locks.has(c.id) ? `<span class="sub-lock" aria-label="Locked">${I.lock}</span>` : "";
      const body = spinning && gReels.includes(c)
        ? reelOf(c)
        : `<span class="combo-val sub${isEmptyVal(c, v) ? " empty" : ""}">${esc(shownVal(cur, c, v))}${lockMark}</span>${badgePills(optionBadges(list, c, v))}${optionNote(c, v)}`;
      return `<button class="combo-sub" data-act="pickCat" data-cat="${c.id}" aria-label="${esc(c.name)}" ${off}>${body}</button>`;
    }).join("");
    const firstEmpty = g.members.find((c) => !fills(c));
    const none = !seen.length
      ? `<button class="combo-sub" data-act="pickCat" data-cat="${g.members[0].id}" ${off}><span class="combo-val sub empty">-</span><span class="opt-note">No ${esc(g.name.toLowerCase())}</span></button>` : "";
    const add = !spinning && seen.length && firstEmpty ? `<button class="combo-add" data-act="pickCat" data-cat="${firstEmpty.id}">+ Add</button>` : "";
    const n = catOptions(g.members[0]).length;
    return `
      <div class="combo-row${allLocked ? " locked" : ""}" data-cat="${g.members[0].id}" data-cats="${ids.join(",")}" style="--k:${k};--c:${WHEEL_COLORS[k % WHEEL_COLORS.length]}">
        <div class="combo-main combo-group">
          <span class="combo-cat">${esc(g.name)}</span>
          ${subs}${none}${add}
        </div>
        <span class="combo-count" title="${n} options" aria-label="${n} options">${n}</span>
        <button class="iconbtn lockbtn" data-act="lock" data-cats="${ids.join(",")}" aria-pressed="${allLocked}" aria-label="${allLocked ? "Unlock" : "Lock"} ${esc(g.name)}" ${off}>${allLocked ? I.lock : I.unlock}</button>
        ${spinning ? "" : grip}
      </div>`;
  };

  const rowCats = shown.filter((c) => !g || (c !== g.count && (!g.members.includes(c) || c === g.members[0])));
  const rows = rowCats.map((c, k) => {
    if (g && c === g.members[0]) return groupRow(k);
    const locked = cur.locks.has(c.id);
    const val = spinning && reels.includes(c)
      ? `<span class="combo-val reel" data-cat="${c.id}"><span class="strip"><span>${esc(shownVal(cur, c, cur.picks[c.id]))}</span></span></span>`
      : `${levelChips(cur, c) || `<span class="combo-val${isEmptyVal(c, cur.picks[c.id]) ? " empty" : ""}">${esc(shownVal(cur, c, cur.picks[c.id]))}</span>`}${badgePills(optionBadges(list, c, cur.picks[c.id]))}${optionNote(c, cur.picks[c.id])}`;
    const shine = spinning && reels.includes(c) ? "" : gold.includes(c) ? "gold" : shineOf(c, cur.picks[c.id]);
    return `
      <div class="combo-row${locked ? " locked" : ""}${shine ? ` ${shine}` : ""}" data-cat="${c.id}" style="--k:${k};--c:${WHEEL_COLORS[k % WHEEL_COLORS.length]}">
        <button class="combo-main" data-act="pickCat" data-cat="${c.id}" ${off}>
          <span class="combo-cat">${esc(c.name)}</span>
          ${val}
        </button>
        <span class="combo-count" title="${catOptions(c).length} options" aria-label="${catOptions(c).length} options">${catOptions(c).length}</span>
        <button class="iconbtn lockbtn" data-act="lock" data-cat="${c.id}" aria-pressed="${locked}" aria-label="${locked ? "Unlock" : "Lock"} ${esc(c.name)}" ${off}>${locked ? I.lock : I.unlock}</button>
        ${spinning ? "" : grip}
      </div>`;
  }).join("");

  let stage;
  if (!live.length) {
    const allOff = list.cats.some((c) => c.off && catOptions(c).length);
    stage = allOff ? `
      <p class="empty-title">All categories are hidden</p>
      <p class="empty-text">Show one in Edit to include it in the roll.</p>
      <button class="btn primary sm" data-act="edit">Edit categories</button>` : `
      <p class="empty-title">Nothing to pick yet</p>
      <p class="empty-text">Add a category with a few options.</p>
      <button class="btn primary sm" data-act="edit">Add categories</button>`;
  } else if (!shown.length) {
    stage = `
      <p class="empty-title">All categories are hidden</p>
      <p class="empty-text">They're still rolling. Show one to see its result.</p>
      <button class="btn primary sm" data-act="hideSheet">Show categories</button>`;
  } else {
    // Drag a row (handle, or press and hold) to change the category order.
    const combo = `<div class="group combo${cur.reveal ? " reveal" : ""}"${spinning ? "" : ' data-sort="combo"'}>${rows}</div>`;
    stage = spinning
      ? `<div class="slots"><div class="slots-glow"></div><div class="slots-frame"><div class="bulbs"></div>${combo}</div></div>`
      : combo;
    cur.reveal = false;
  }

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title"><span class="top-icon">${icon(list)}</span><span class="ellip">${esc(list.name)}</span></div>
        <button class="iconbtn" data-act="edit" aria-label="Edit multiple">${I.edit}</button>
      </div>
      <section class="stage combo-stage${spinning ? " spin" : ""}" aria-live="polite">${stage}</section>
      ${live.length ? `
      <div class="actions">
        <p class="combo-hint">Tap a result to choose it yourself</p>
        <button class="linkbtn" data-act="hideSheet" ${off}>${I.eye} ${cur.hidden.size ? `Show or hide · ${live.length - shown.length} hidden` : "Show or hide categories"}</button>
        <div class="btn-row">
          <button class="btn toggle" data-act="wheel" role="switch" aria-checked="${!!db.wheel}"><span class="switch" aria-hidden="true"></span> Reels</button>
          <button class="btn primary" data-act="reroll" ${off}>${I.reroll} Reroll</button>
        </div>
      </div>` : ""}
      ${gold.length ? `<div class="gold-glow"></div>` : ""}
    </main>`;
  if (spinning) return slotSpin(list, spinReels);
  if (gold.length && !cur.goldShown) goldBurst(gold[0]);
  cur.goldShown = gold.length > 0;
}

function renderEdit(list) {
  const items = list.items.map((it, i) => itemRow(list, it, i, "Item")).join("");

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title">Edit list</div>
        <button class="pill" data-act="back">Done</button>
      </div>
      <div class="name-row">
        <button class="input emoji-in" data-act="iconSheet" aria-label="Change icon">${icon(list)}<span class="badge">${I.cameraSm}</span></button>
        <input class="input" data-field="name" value="${esc(list.name)}" aria-label="List name" enterkeyhint="done">
      </div>
      <textarea class="input desc-in" data-field="description" rows="1" placeholder="Add a description…" aria-label="Description">${esc(list.description || "")}</textarea>
      ${labelsField(list)}
