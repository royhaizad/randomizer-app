<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randomizer</title>
<meta name="description" content="Tap a list, get an answer.">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ---------- Brand font ---------- */
  /* Plus Jakarta Sans, Latin letters, one file covers weights 400 to 700. */
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("fonts/plus-jakarta-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* ---------- Design tokens (light) ---------- */
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --surface-2: #EBEFF3;
    --line: rgba(12, 18, 26, 0.08);
    --text: #0A0F14;
    --muted: #5E6A76;
    --accent: #0891B2;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(8, 145, 178, 0.10);
    --glow: 0 6px 20px rgba(8, 145, 178, 0.25);
    --text-glow: none;
    --danger: #DC2626;
    --shadow: 0 1px 2px rgba(12, 18, 26, 0.04), 0 8px 24px rgba(12, 18, 26, 0.06);
    --lift: 0 12px 28px rgba(12, 18, 26, 0.16);
    --radius: 18px;
    color-scheme: light dark;
  }
  /* ---------- Design tokens (dark) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07090C;
      --surface: #0F1318;
      --surface-2: #181D24;
      --line: rgba(255, 255, 255, 0.07);
      --text: #E9EEF3;
      --muted: #8994A0;
      --accent: #22D3EE;
      --accent-ink: #03161B;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --glow: 0 0 28px rgba(34, 211, 238, 0.35);
      --text-glow: 0 0 32px rgba(34, 211, 238, 0.35);
      --danger: #F87171;
      --shadow: none;
      --lift: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .view {
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }

  /* ---------- Shared pieces ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; padding: 20px 2px 16px; }
  .head h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }

  .iconbtn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 12px;
  }
  .iconbtn:active { background: var(--surface-2); }
  .iconbtn.sm { width: 40px; height: 40px; color: var(--muted); }

  .pill {
    height: 36px; padding: 0 16px;
    border: 0; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 15px;
  }
  .pill:active { opacity: 0.7; }

  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 68px;
    padding: 12px 14px;
    background: none; border: 0; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--surface-2); }
  .row.compact { min-height: 52px; padding: 10px 16px; }

  .emoji {
    width: 42px; height: 42px; flex: none;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 22px;
  }
  .row-text { flex: 1; min-width: 0; }
  .row-name, .row-sub, .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-name { font-size: 16px; font-weight: 600; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); opacity: 0.6; display: grid; }
  .tag { font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 999px; flex: none; }
  .check { color: var(--accent); display: grid; flex: none; }
  .row.dim .row-name { color: var(--muted); text-decoration: line-through; font-weight: 500; }

  .hint { font-size: 14px; color: var(--muted); margin: 0 2px 14px; line-height: 1.45; }

  .btn {
    flex: 1; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface);
    font-size: 16px; font-weight: 600;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { flex: 1.5; background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow); }
  .btn.ghost { margin-top: 12px; flex: none; width: 100%; color: var(--accent); background: transparent; border-style: dashed; }
  .btn.sm { height: 48px; flex: none; padding: 0 20px; border-radius: 12px; }

  /* ---------- Top bar (result + edit) ---------- */
  .topbar { display: flex; align-items: center; gap: 6px; height: 56px; margin: 8px -6px 0; }
  .top-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }

  /* ---------- Result screen ---------- */
  .stage {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px 8px;
    text-align: center;
  }
  .answer {
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.08;
    text-wrap: balance;
    overflow-wrap: anywhere;
    text-shadow: var(--text-glow);
    animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .answer.s { font-size: clamp(42px, 13vw, 68px); }
  .answer.m { font-size: clamp(32px, 10vw, 50px); }
  .answer.l { font-size: clamp(26px, 7.5vw, 38px); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  .meta { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 34ch; }
  .empty-title { margin: 0; font-size: 22px; font-weight: 700; }
  .empty-text { margin: -12px 0 0; font-size: 15px; color: var(--muted); }

  .actions { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 18px; }
  .btn-row { display: flex; gap: 10px; }
  .linkbtn {
    align-self: center; height: 44px; padding: 0 14px;
    display: flex; align-items: center; gap: 8px;
    background: none; border: 0; border-radius: 12px;
    color: var(--muted); font-size: 14px; font-weight: 500;
  }
  .linkbtn:active { background: var(--surface-2); }

  /* ---------- Edit list screen ---------- */
  .name-row { display: flex; gap: 10px; margin: 8px 0 22px; }
  .input {
    width: 100%; height: 50px; padding: 0 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    font-size: 16px;
  }
  .input:focus, .item-in:focus { outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .emoji-in { width: 58px; flex: none; text-align: center; font-size: 22px; padding: 0; }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 4px 8px; }
  .item-row { display: flex; align-items: center; padding-left: 16px; padding-right: 4px; min-height: 52px; }
  .item-row + .item-row { border-top: 1px solid var(--line); }
  .item-row:focus-within { background: var(--accent-soft); }
  .item-in { flex: 1; min-width: 0; height: 50px; background: none; border: 0; font-size: 16px; }
  .dangerbtn { margin: 18px auto 8px; height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 12px; color: var(--danger); font-size: 15px; font-weight: 500; }
  .dangerbtn:active { background: var(--surface-2); }
  .addbar {
    position: sticky; bottom: 0;
    display: flex; gap: 10px;
    margin: auto -16px 0; padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
  }
  .addbar .btn { box-shadow: none; }

  /* ---------- Manage (edit lists) ---------- */
  .move { display: flex; gap: 2px; flex: none; }
  .move .iconbtn:disabled { opacity: 0.25; }

  /* ---------- Drag to reorder ---------- */
  .grip {
    width: 36px; height: 44px; flex: none;
    display: grid; place-items: center;
    color: var(--muted); opacity: 0.7;
    touch-action: none; cursor: grab;
  }
  .row .grip { margin-right: -8px; }
  /* Edit lists rows carry arrows + handle, so keep them compact to leave room for names. */
  .row:has(.move) { gap: 10px; padding-right: 8px; }
  .row:has(.move) .grip { width: 28px; margin-right: 0; }
  .move .iconbtn.sm { width: 34px; }
  .item-row .grip { margin-left: -12px; }
  [data-sort] { position: relative; }
  [data-sort] > * { transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1); }
  [data-sort].sorting { overflow: visible; }
  [data-sort] > .dragging {
    position: relative; z-index: 5; transition: none;
    background: var(--surface-2); border-radius: 14px; border-color: transparent;
    box-shadow: var(--lift);
  }
  body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }
  [data-sort="lists"] > .row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* ---------- Bottom sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 10; }
  .sheet[hidden] { display: none; }
  .backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); animation: fade 0.2s ease; }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 560px; max-height: 82dvh; margin: 0 auto;
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg);
    border: 1px solid var(--line); border-bottom: 0;
    border-radius: 24px 24px 0 0;
    padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    animation: up 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  @media (prefers-color-scheme: dark) { .handle { background: rgba(255, 255, 255, 0.18); } }
  .sheet-title { margin: 0 4px 14px; font-size: 18px; font-weight: 700; }
  .menu-icon { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
  .foot { font-size: 13px; color: var(--muted); text-align: center; margin: 16px 0 0; line-height: 1.5; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 20;
    transform: translate(-50%, 8px);
    max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".txt,.json,text/plain,application/json" hidden>

<script>
/* =========================================================
   1. Starting data: your 9 lists from the backup file
   ========================================================= */
const BACKUP = {"Seetru makan mana":["Amin","Aslam","Ayam Kunyit (tapaw)","Bidayah","Hasilath","Ijo Moyan","Nasi Mandy","Padang","Palawan","Uncle"],"Balik keje makan luar":["Ayam Gepuk","Sambal Ulek","Rasmeena","LepaQ","Family Mart","Boat Noodle","Sup Irfan","Andan","Kebab dpn SkyAwaniV","Al-Bidayah Sentul Point","Meratah"],"Masak apa":["Ayam goreng","Nasi goreng","Roti telur","Sambal ayam","Sambal telur dadar","Sambal telur rebus","Telur kicap","Sup ayam","Tempe goreng","Daging masak lemak","Tofu sup","Broccoli","Butter chicken","Jagung"],"Breakfast apa":["Cereal","Nugget/Patties/Sosej/Fillet","Roti/toast","Roti canai kedai","Telur","Kuih/nasi lemak","Baked beans","Campbell's Soup","Roti telur","Cucur adabi","Roti canai instant","Karipap instant"],"Lunch apa (maxim)":["Ayam Gepuk","Ayam goreng","Nasi goreng","Rasmeena","Roti telur","Sambal ayam","Sambal telur dadar","Sambal telur rebus","Sambal Ulek","Soto/Mi Kari","Telur kicap"],"Fun activities":["Bowling","Ice skating","Jogging","Game at friend's house","Marathon ","Sketchwalk","Skytrex Shah Alam ","Swimming","Wayang","Roller blading","Tufting/Making art","Mandi sungai","Hiking","Jamming","Karaoke","Baby expo","Bezza event","Figma/UIUX event","Anime/Games event","Kayak","Pantai","Thrifting/Bundle","Go cart","Camping","Ziarah friend's house","Belanja kawan makan","FRIM","Water rafting"],"MyTown makan mana":["Mi Tarik","Richeese","Subway"],"Sahur protein apa":["Goreng/sup (ayam)","Cereal (with susu, oats, honey) 🍔","Nasi kicap (with edamame)","Maggi (with telur) 🍔","Nasi (with telur)","Roti (with telur/cheese)","Tofu sup","Nasi (with tempe goreng)","Nuggets 🍔","Baked beans (with eggs) 🍔","Nasi/roti (with sardin)","Kentang (with cheese)","Bubur (with kacang/ayam/telur)"],"Menunggu?":["Baca BuiltforMars","Susun shopping list","Baca Knowledge Sharing","cantunsee.space","Kern Type ","Color Method","It's centered that","Susun Keep: Free Time dpn comp : which priority"]};

// Starting order: eat-out lists, then cook/meal lists, then activities.
const ORDER = ["Seetru makan mana", "Balik keje makan luar", "MyTown makan mana", "Masak apa", "Breakfast apa", "Lunch apa (maxim)", "Sahur protein apa", "Fun activities", "Menunggu?"];

const EMOJI = {
  "Seetru makan mana": "🍛", "Balik keje makan luar": "🚗", "MyTown makan mana": "🛍️",
  "Masak apa": "🍳", "Breakfast apa": "🥞", "Lunch apa (maxim)": "🍱",
  "Sahur protein apa": "🌙", "Fun activities": "🎳", "Menunggu?": "⏳"
};
const DEFAULT_EMOJI = "🎲";

/* =========================================================
   2. Saving (everything lives on this phone only)
   ========================================================= */
const KEY = "randomizer.v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const clean = (items) => items.map((s) => String(s).trim()).filter(Boolean);

function listsFromBackup(obj, order = []) {
  const names = [...order.filter((n) => n in obj), ...Object.keys(obj).filter((n) => !order.includes(n))];
  return names
    .filter((n) => Array.isArray(obj[n]))
    .map((n) => ({ id: uid(), name: n.trim(), emoji: EMOJI[n] || DEFAULT_EMOJI, items: clean(obj[n]) }));
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.lists)) return saved;
  } catch (e) {}
  return { lists: listsFromBackup(BACKUP, ORDER), history: {}, skips: {} };
}

let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Couldn't save on this device"); }
}
save();

const findList = (id) => db.lists.find((l) => l.id === id);

/* =========================================================
   3. Random pick, skips and history
   ========================================================= */
function rand(n) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}

const today = () => new Date().toLocaleDateString("en-CA"); // e.g. 2026-10-17, local time

function skipsFor(id) {
  const s = db.skips[id];
  return s && s.day === today() ? s.items : [];
}
function unskip(id, item) {
  const s = db.skips[id];
  if (s) s.items = s.items.filter((i) => i !== item);
}
const pool = (list) => list.items.filter((i) => !skipsFor(list.id).includes(i));

// The answer currently on screen. `rec` = it's already saved in history,
// so a reroll replaces it (history keeps what you ended on, not every roll).
let cur = null;

function roll(list) {
  const p = pool(list);
  cur.item = p.length ? p[rand(p.length)] : null;
  record(list);
}

function record(list) {
  const h = db.history[list.id] || (db.history[list.id] = []);
  if (cur.rec) h.shift();
  cur.rec = !!cur.item;
  if (cur.item) h.unshift(cur.item);
  h.length = Math.min(h.length, 6);
  save();
}

/* =========================================================
   4. Navigation (works with Android's back gesture)
   ========================================================= */
const depth = () => (history.state && history.state.d) || 0;

function route() {
  const [, view, id] = (location.hash.slice(1) || "/").split("/");
  return { view: view || "home", id };
}
function go(path) {
  history.pushState({ d: depth() + 1 }, "", "#" + path);
  render();
}
function back(fallback = "/") {
  if (depth() > 0) history.back();
  else { history.replaceState({ d: 0 }, "", "#" + fallback); render(); }
}
function openSheet(kind) {
  history.pushState({ d: depth() + 1, sheet: kind }, "", location.hash);
  render();
}
const closeSheet = () => history.back();

addEventListener("popstate", render);
if (!history.state) history.replaceState({ d: 0 }, "", location.hash || "#/");

/* =========================================================
   5. Screens
   ========================================================= */
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ic = (paths, size = 22, width = 2) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths.split("|").map((d) => `<path d="${d}"/>`).join("")}</svg>`;
const I = {
  back: ic("M15 18l-6-6 6-6", 24),
  more: ic("M5 12h.01|M12 12h.01|M19 12h.01", 24, 3),
  edit: ic("M12 20h9|M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"),
  reroll: ic("M21 12a9 9 0 1 1-2.6-6.4L21 8|M21 3v5h-5", 20, 2.4),
  skip: ic("M5 4l10 8-10 8z|M19 5v14", 18),
  hand: ic("M8 6h13|M8 12h13|M8 18h13|M3 6h.01|M3 12h.01|M3 18h.01", 18),
  chev: ic("M9 18l6-6-6-6", 18),
  up: ic("M18 15l-6-6-6 6", 20),
  down: ic("M6 9l6 6 6-6", 20),
  x: ic("M18 6L6 18|M6 6l12 12", 18),
  check: ic("M20 6L9 17l-5-5", 20, 2.4),
  lists: ic("M12 20h9|M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z", 20),
  download: ic("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4|M7 10l5 5 5-5|M12 15V3", 20),
  upload: ic("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4|M17 8l-5-5-5 5|M12 3v12", 20),
  grip: ic("M9 6h.01|M15 6h.01|M9 12h.01|M15 12h.01|M9 18h.01|M15 18h.01", 20, 3),
};
const grip = `<span class="grip" aria-hidden="true">${I.grip}</span>`;

function render() {
  const r = route();
  if (r.view === "home" || r.view === "manage") cur = null;

  if (r.view === "list" || r.view === "edit") {
    const list = findList(r.id);
    if (!list) { history.replaceState({ d: depth() }, "", "#/"); return render(); }
    r.view === "list" ? renderResult(list) : renderEdit(list);
  } else if (r.view === "manage") {
    renderManage();
  } else {
    renderHome();
  }
  renderSheet();
}

function renderHome() {
  const rows = db.lists.map((l) => {
    return `
      <button class="row" data-act="open" data-id="${l.id}">
        <span class="emoji">${esc(l.emoji)}</span>
        <span class="row-text">
          <div class="row-name">${esc(l.name)}</div>
        </span>
        <span class="count">${l.items.length}</span>
        ${grip}
      </button>`;
  }).join("");

  app.innerHTML = `
    <main class="view">
      <header class="head">
        <h1>Randomizer</h1>
        <button class="iconbtn" data-act="menu" aria-label="Menu">${I.more}</button>
      </header>
      ${db.lists.length
        ? `<div class="group" data-sort="lists">${rows}</div>`
        : `<p class="hint">No lists yet.</p><button class="btn ghost" data-act="newList">+ New list</button>`}
    </main>`;
}

function renderResult(list) {
  if (!cur || cur.id !== list.id) {
    cur = { id: list.id, item: null, rec: false };
    roll(list);
  } else if (cur.item && !list.items.includes(cur.item)) {
    roll(list); // item was renamed or deleted while editing
  }

  const skipped = skipsFor(list.id);
  const size = (s) => (s.length <= 12 ? "s" : s.length <= 26 ? "m" : "l");

  let stage;
  if (!list.items.length) {
    stage = `
      <p class="empty-title">This list is empty</p>
      <p class="empty-text">Add a few options first.</p>
      <button class="btn primary sm" data-act="edit">Add items</button>`;
  } else if (!cur.item) {
    stage = `
      <p class="empty-title">All skipped for today</p>
      <p class="empty-text">Every option is skipped until midnight.</p>
      <button class="btn primary sm" data-act="resetSkips">Reset skips</button>`;
  } else {
    stage = `
      <p class="answer ${size(cur.item)}">${esc(cur.item)}</p>
      <div class="meta">
        ${skipped.length ? `<div>${skipped.length} skipped today</div>` : ""}
      </div>`;
  }

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title"><span>${esc(list.emoji)}</span><span class="ellip">${esc(list.name)}</span></div>
        <button class="iconbtn" data-act="edit" aria-label="Edit list">${I.edit}</button>
      </div>
      <section class="stage" aria-live="polite">${stage}</section>
      ${list.items.length ? `
      <div class="actions">
        <button class="linkbtn" data-act="pick">${I.hand} Pick by hand</button>
        ${cur.item ? `
        <div class="btn-row">
          <button class="btn" data-act="skip">${I.skip} Skip today</button>
          <button class="btn primary" data-act="reroll">${I.reroll} Reroll</button>
        </div>` : ""}
      </div>` : ""}
    </main>`;
}

function renderEdit(list) {
  const items = list.items.map((it, i) => `
    <div class="item-row">
      ${grip}
      <input class="item-in" data-field="item" data-i="${i}" value="${esc(it)}" enterkeyhint="done" aria-label="Item ${i + 1}">
      <button class="iconbtn sm" data-act="delItem" data-i="${i}" aria-label="Delete ${esc(it)}">${I.x}</button>
    </div>`).join("");

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title">Edit list</div>
        <button class="pill" data-act="back">Done</button>
      </div>
      <div class="name-row">
        <input class="input emoji-in" data-field="emoji" value="${esc(list.emoji)}" aria-label="Emoji" enterkeyhint="done">
        <input class="input" data-field="name" value="${esc(list.name)}" aria-label="List name" enterkeyhint="done">
      </div>
      <div class="label">Items · <span id="itemCount">${list.items.length}</span></div>
      ${list.items.length ? `<div class="group" data-sort="items">${items}</div>` : `<p class="hint">No items yet. Add your first one below.</p>`}
      <button class="dangerbtn" data-act="deleteList">Delete this list</button>
      <form class="addbar" data-form="add">
        <input class="input" id="addInput" placeholder="Add an item…" enterkeyhint="send" autocomplete="off">
        <button class="btn primary sm" type="submit">Add</button>
      </form>
    </main>`;
}

function renderManage() {
  const n = db.lists.length;
  const rows = db.lists.map((l, i) => `
    <div class="row" data-act="openEdit" data-id="${l.id}" role="button" tabindex="0">
      <span class="emoji">${esc(l.emoji)}</span>
      <span class="row-text">
        <div class="row-name">${esc(l.name)}</div>
        <div class="row-sub">${l.items.length} items · tap to edit</div>
      </span>
      <span class="move">
        <button class="iconbtn sm" data-act="up" data-i="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${I.up}</button>
        <button class="iconbtn sm" data-act="down" data-i="${i}" aria-label="Move down" ${i === n - 1 ? "disabled" : ""}>${I.down}</button>
      </span>
      ${grip}
    </div>`).join("");

  app.innerHTML = `
    <main class="view">
      <header class="head">
        <h1>Edit lists</h1>
        <button class="pill" data-act="done">Done</button>
      </header>
      <p class="hint">Tap a list to edit its name and items. Drag a list, or use the arrows, to reorder.</p>
      ${n ? `<div class="group" data-sort="lists">${rows}</div>` : ""}
      <button class="btn ghost" data-act="newList">+ New list</button>
    </main>`;
}

let shownSheet = null;
function renderSheet() {
  const kind = history.state && history.state.sheet;
  const el = $("#sheet");
  if (kind === shownSheet) return;
  shownSheet = kind || null;
  document.body.style.overflow = kind ? "hidden" : "";
  if (!kind) { el.hidden = true; el.innerHTML = ""; return; }

  let body = "";
  if (kind === "menu") {
    body = `
      <h2 class="sheet-title">Menu</h2>
      <div class="group">
        <button class="row" data-act="manage"><span class="menu-icon">${I.lists}</span><span class="row-text"><div class="row-name">Edit lists</div><div class="row-sub">Add, rename, reorder, delete</div></span></button>
        <button class="row" data-act="export"><span class="menu-icon">${I.download}</span><span class="row-text"><div class="row-name">Back up</div><div class="row-sub">Save a backup file to Downloads</div></span></button>
        <button class="row" data-act="import"><span class="menu-icon">${I.upload}</span><span class="row-text"><div class="row-name">Restore from backup</div><div class="row-sub">Replace lists with a backup file</div></span></button>
      </div>
      <p class="foot">Your lists are saved on this phone only.<br>Back up now and then.</p>`;
  } else if (kind === "pick") {
    const list = cur && findList(cur.id);
    if (!list) { el.hidden = true; return; }
    const skipped = skipsFor(list.id);
    const rows = list.items.map((it, i) => {
      const isSkip = skipped.includes(it);
      return `
        <button class="row compact ${isSkip ? "dim" : ""}" data-act="choose" data-i="${i}">
          <span class="row-text"><div class="row-name">${esc(it)}</div></span>
          ${isSkip ? `<span class="tag">Skipped · tap to bring back</span>` : it === cur.item ? `<span class="check">${I.check}</span>` : ""}
        </button>`;
    }).join("");
    body = `<h2 class="sheet-title">${esc(list.emoji)} Pick by hand</h2><div class="group">${rows}</div>`;
  }

  el.innerHTML = `
    <div class="backdrop" data-act="closeSheet"></div>
    <div class="panel" role="dialog" aria-modal="true"><div class="handle"></div>${body}</div>`;
  el.hidden = false;
}

/* =========================================================
   6. What each button does
   ========================================================= */
const currentList = () => findList(route().id);

function uniqueName(name, exceptId) {
  const base = name.trim() || "Untitled";
  const taken = new Set(db.lists.filter((l) => l.id !== exceptId).map((l) => l.name));
  let n = base, k = 2;
  while (taken.has(n)) n = `${base} ${k++}`;
  return n;
}

const actions = {
  open: (el) => go("/list/" + el.dataset.id),
  openEdit: (el) => go("/edit/" + el.dataset.id),
  menu: () => openSheet("menu"),
  back: () => {
    // Don't lose an item that was typed but not yet added.
    const add = $("#addInput");
    if (add && add.value.trim()) { currentList().items.push(add.value.trim()); save(); }
    back("/");
  },
  done: () => back("/"),
  edit: () => go("/edit/" + route().id),
  closeSheet,

  reroll: () => {
    roll(currentList());
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  },
  skip: () => {
    const list = currentList();
    if (!cur.item) return;
    const t = today();
    let s = db.skips[list.id];
    if (!s || s.day !== t) s = db.skips[list.id] = { day: t, items: [] };
    if (!s.items.includes(cur.item)) s.items.push(cur.item);
    roll(list);
    render();
  },
  resetSkips: () => {
    const list = currentList();
    delete db.skips[list.id];
    roll(list);
    render();
  },
  pick: () => openSheet("pick"),
  choose: (el) => {
    const list = findList(cur.id);
    const item = list.items[+el.dataset.i];
    unskip(list.id, item);
    cur.item = item;
    record(list);
    closeSheet();
  },

  manage: () => {
    // Swap the open menu for the Edit lists screen, so Back returns home.
    history.replaceState({ d: depth() }, "", "#/manage");
    render();
  },
  up: (el) => move(+el.dataset.i, -1),
  down: (el) => move(+el.dataset.i, 1),
  newList: () => {
    const l = { id: uid(), name: uniqueName("New list"), emoji: DEFAULT_EMOJI, items: [] };
    db.lists.push(l);
    save();
    go("/edit/" + l.id);
    const name = $('[data-field="name"]');
    name.focus();
    name.select();
  },
  delItem: (el) => {
    const list = currentList();
    list.items.splice(+el.dataset.i, 1);
    save();
    render();
  },
  deleteList: () => {
    const list = currentList();
    if (!confirm(`Delete “${list.name}” and its ${list.items.length} items?`)) return;
    db.lists = db.lists.filter((l) => l.id !== list.id);
    delete db.history[list.id];
    delete db.skips[list.id];
    save();
    toast("List deleted");
    back("/");
  },

  export: () => {
    closeSheet();
    exportBackup();
  },
  import: () => {
    $("#file").click();
    closeSheet();
  },
};

function move(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= db.lists.length) return;
  [db.lists[i], db.lists[j]] = [db.lists[j], db.lists[i]];
  save();
  render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el, e);
});

// Editing text fields saves automatically when you leave the field.
document.addEventListener("change", (e) => {
  const f = e.target.dataset.field;
  const list = currentList();
  if (!f || !list) return;
  const v = e.target.value.trim();

  if (f === "name") {
    list.name = uniqueName(v, list.id);
    e.target.value = list.name;
  } else if (f === "emoji") {
    list.emoji = v || DEFAULT_EMOJI;
    e.target.value = list.emoji;
  } else if (f === "item") {
    const i = +e.target.dataset.i;
    if (v) { list.items[i] = v; e.target.value = v; }
    else { list.items.splice(i, 1); save(); return render(); }
  }
  save();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.field) e.target.blur();
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.act === "openEdit") e.target.click();
});

document.addEventListener("submit", (e) => {
  if (e.target.dataset.form !== "add") return;
  e.preventDefault();
  const input = $("#addInput");
  const v = input.value.trim();
  if (!v) return;
  const list = currentList();
  list.items.push(v);
  save();
  render();
  $("#addInput").focus();
  scrollTo(0, document.body.scrollHeight); // show the item you just added
});

/* =========================================================
   6b. Drag to reorder
   Lists: drag the ⋮⋮ handle, or press and hold a row.
   Items: drag the ⋮⋮ handle (holding a text field selects text).
   ========================================================= */
const HOLD_MS = 400;
let hold = null;          // waiting for a long-press to finish
let drag = null;          // the row being dragged
let suppressClickUntil = 0;

document.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || drag) return;
  const row = e.target.closest("[data-sort] > *");
  if (!row) return;
  if (e.target.closest(".grip")) { e.preventDefault(); startDrag(row, e.pointerId, e.clientY); return; }
  if (row.parentElement.dataset.sort !== "lists" || e.target.closest(".move")) return;
  const h = { row, id: e.pointerId, x: e.clientX, y: e.clientY };
  h.timer = setTimeout(() => { hold = null; startDrag(h.row, h.id, h.y); }, HOLD_MS);
  hold = h;
});

document.addEventListener("pointermove", (e) => {
  // Moving before the hold finishes means you're scrolling, not dragging.
  if (hold && e.pointerId === hold.id && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 8) cancelHold();
  // Only the finger that started the drag moves it (ignore a second finger).
  if (drag && e.pointerId === drag.id) { drag.y = e.clientY; layoutDrag(); }
});
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
// Stop the page from scrolling under your finger while a row is lifted.
document.addEventListener("touchmove", (e) => { if (drag) e.preventDefault(); }, { passive: false });
// No Android long-press menu on list rows.
document.addEventListener("contextmenu", (e) => { if (drag || hold || e.target.closest('[data-sort="lists"]')) e.preventDefault(); });
// The tap that ends a drag shouldn't also open the list.
document.addEventListener("click", (e) => {
  if (performance.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
}, true);

function cancelHold() { if (hold) { clearTimeout(hold.timer); hold = null; } }
function endPointer(e) {
  if (hold && e.pointerId === hold.id) cancelHold();
  if (drag && e.pointerId === drag.id) endDrag();
}

function startDrag(row, pointerId, y) {
  const group = row.parentElement;
  const rows = [...group.children];
  const from = rows.indexOf(row);
  drag = { group, rows, row, from, to: from, id: pointerId, y, startY: y + scrollY, h: row.offsetHeight };
  try { row.setPointerCapture(pointerId); } catch (e) {}
  group.classList.add("sorting");
  row.classList.add("dragging");
  row.style.transform = "scale(1.02)";
  document.body.classList.add("is-dragging");
  if (navigator.vibrate) navigator.vibrate(15);
  requestAnimationFrame(autoScroll);
}

// Move the lifted row with your finger and slide the others out of the way.
function layoutDrag() {
  const { rows, row, from, h } = drag;
  const dy = drag.y + scrollY - drag.startY;
  row.style.transform = `translateY(${dy}px) scale(1.02)`;
  const center = row.offsetTop + h / 2 + dy;
  let to = 0;
  rows.forEach((r, i) => { if (i !== from && center > r.offsetTop + r.offsetHeight / 2) to++; });
  rows.forEach((r, i) => {
    if (i === from) return;
    const shift = from < to && i > from && i <= to ? -h : from > to && i >= to && i < from ? h : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
  if (to !== drag.to && navigator.vibrate) navigator.vibrate(5);
  drag.to = to;
}

// Scroll the page when you drag near the top or bottom edge (long lists).
function autoScroll() {
  if (!drag) return;
  const edge = 90, y = drag.y;
  const speed = y < edge ? -(edge - y) / 5 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 5 : 0;
  if (speed) { scrollBy(0, speed); layoutDrag(); }
  requestAnimationFrame(autoScroll);
}

function endDrag() {
  const { group, from, to } = drag;
  drag = null;
  document.body.classList.remove("is-dragging");
  suppressClickUntil = performance.now() + 400;
  if (to !== from) {
    const arr = group.dataset.sort === "lists" ? db.lists : currentList().items;
    arr.splice(to, 0, ...arr.splice(from, 1));
    save();
  }
  render();
}

/* =========================================================
   7. Backup & restore (same format as the old app)
   ========================================================= */
function exportBackup() {
  const obj = {};
  db.lists.forEach((l) => (obj[l.name] = l.items));
  const blob = new Blob([JSON.stringify(obj)], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Randomizer-Backup-${today()}.txt`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup saved to Downloads");
}

$("#file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (err) {}
  const names = obj && typeof obj === "object" && !Array.isArray(obj) ? Object.keys(obj).filter((k) => Array.isArray(obj[k])) : [];
  if (!names.length) return toast("That file isn't a Randomizer backup");
  if (!confirm(`Replace your ${db.lists.length} lists with the ${names.length} lists in this backup?`)) return;

  // Keep emoji and history for lists that have the same name.
  const old = Object.fromEntries(db.lists.map((l) => [l.name, l]));
  db.lists = names.map((n) => {
    const name = n.trim(), prev = old[name];
    return { id: prev ? prev.id : uid(), name, emoji: prev ? prev.emoji : EMOJI[n] || EMOJI[name] || DEFAULT_EMOJI, items: clean(obj[n]) };
  });
  const ids = new Set(db.lists.map((l) => l.id));
  for (const k of Object.keys(db.history)) if (!ids.has(k)) delete db.history[k];
  for (const k of Object.keys(db.skips)) if (!ids.has(k)) delete db.skips[k];
  save();
  history.replaceState({ d: depth() }, "", "#/");
  render();
  toast(`Restored ${names.length} lists`);
});

/* =========================================================
   8. Little helpers + start
   ========================================================= */
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

render();

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
