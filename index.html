<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randomizer</title>
<meta name="description" content="Tap a list, get an answer.">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ---------- Brand font ---------- */
  /* Plus Jakarta Sans, Latin letters, one file covers weights 400 to 700. */
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("fonts/plus-jakarta-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* ---------- Design tokens (light) ---------- */
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --surface-2: #EBEFF3;
    --line: rgba(12, 18, 26, 0.08);
    --text: #0A0F14;
    --muted: #5E6A76;
    --accent: #0891B2;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(8, 145, 178, 0.10);
    --glow: 0 6px 20px rgba(8, 145, 178, 0.25);
    --text-glow: none;
    --danger: #DC2626;
    --shadow: 0 1px 2px rgba(12, 18, 26, 0.04), 0 8px 24px rgba(12, 18, 26, 0.06);
    --lift: 0 12px 28px rgba(12, 18, 26, 0.16);
    --radius: 18px;
    color-scheme: light dark;
  }
  /* ---------- Design tokens (dark) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07090C;
      --surface: #0F1318;
      --surface-2: #181D24;
      --line: rgba(255, 255, 255, 0.07);
      --text: #E9EEF3;
      --muted: #8994A0;
      --accent: #22D3EE;
      --accent-ink: #03161B;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --glow: 0 0 28px rgba(34, 211, 238, 0.35);
      --text-glow: 0 0 32px rgba(34, 211, 238, 0.35);
      --danger: #F87171;
      --shadow: none;
      --lift: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .view {
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }

  /* ---------- Shared pieces ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; padding: 20px 2px 16px; }
  .head h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  /* Home header: die logo, app name + one-line tagline, then + and menu. */
  .head:has(.logo) { justify-content: flex-start; gap: 12px; }
  .logo {
    width: 46px; height: 46px; flex: none;
    display: grid; place-items: center;
    border-radius: 14px;
    background: var(--accent-soft); color: var(--accent);
    box-shadow: var(--glow);
  }
  .head-text { flex: 1; min-width: 0; }
  .tagline { margin: 4px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .head:has(.logo) > .iconbtn { margin-right: -6px; }

  /* Home: search + sort, then label filter chips. */
  .toolbar { display: flex; gap: 8px; margin: 0 0 10px; }
  .search {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    color: var(--muted);
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: var(--text); font-size: 16px; }
  .search input::placeholder { color: var(--muted); }
  .sortbtn { height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 14px; flex: none; }
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px 12px; padding: 2px 16px;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) 75% 55%); }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .chip.on i { background: currentColor; }
  .no-match { text-align: center; padding: 24px 0; }
  .no-match .hint { margin-bottom: 12px; }

  /* Label pills (on Home rows, the edit screen and the Labels sheet). */
  .pill-label {
    display: inline-block; vertical-align: 1px;
    margin-right: 6px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600; line-height: 18px;
    background: hsl(var(--h) 80% 50% / 0.14); color: hsl(var(--h) 65% 36%);
  }
  @media (prefers-color-scheme: dark) { .pill-label { color: hsl(var(--h) 85% 72%); } }
  .row .row-text > .pill-label { font-size: 14px; line-height: 24px; padding: 1px 10px; }
  .labels-in {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0;
    height: auto; min-height: 50px; padding: 10px 14px; margin-bottom: 22px; text-align: left;
  }
  .labels-in:active { background: var(--surface-2); }
  .labels-add { font-size: 15px; color: var(--accent); font-weight: 600; }

  /* Option badges: a wrapping row of pills under an option. */
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .badges .pill-label { margin-right: 0; }
  .answer-badges { justify-content: center; gap: 8px; margin-top: -8px; }
  .answer-badges .pill-label { font-size: 15px; line-height: 22px; padding: 3px 12px; }
  .answer-badges.reveal { animation: reveal 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) 0.15s both; }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item-main .badges { margin: 0 0 11px; }
  .item-main:has(.badges) .item-in { height: 40px; margin-top: 2px; }
  .iconbtn.has-badges { color: var(--accent); }
  .item-row.ro { display: block; }
  .item-row.ro .badges { margin-top: 4px; }
  .sheet-label { margin-top: 18px; }
  .still { animation: none !important; }

  /* Floating "+" on Home: bottom right, inside the app's column on wide screens. */
  .fab {
    position: fixed; z-index: 5;
    right: max(16px, calc((100vw - 560px) / 2 + 16px));
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 60px; height: 60px;
    display: grid; place-items: center;
    border: 0; border-radius: 20px;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: var(--glow), var(--lift);
    transition: transform 0.08s ease;
  }
  .fab:active { transform: scale(0.94); }
  .view:has(> .fab) { padding-bottom: calc(96px + env(safe-area-inset-bottom)); } /* last row can scroll clear of it */
  /* While a list is lifted, + becomes a trash can: drop the list on it to delete. */
  .fab > span { display: grid; }
  .fab-trash { display: none !important; }
  body.is-dragging .fab { background: var(--danger); color: #FFFFFF; box-shadow: var(--lift); transition: transform 0.15s cubic-bezier(0.3, 1.5, 0.5, 1); }
  body.is-dragging .fab-plus { display: none; }
  body.is-dragging .fab-trash { display: grid !important; }
  body.is-dragging .fab.armed { transform: scale(1.2); box-shadow: 0 0 0 8px rgba(220, 38, 38, 0.25), var(--lift); }
  [data-sort] > .dragging.to-trash { opacity: 0.6; }

  .iconbtn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 12px;
  }
  .iconbtn:active { background: var(--surface-2); }
  .iconbtn.sm { width: 40px; height: 40px; color: var(--muted); }

  .pill {
    height: 36px; padding: 0 16px;
    border: 0; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 15px;
  }
  .pill:active { opacity: 0.7; }

  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 68px;
    padding: 12px 14px;
    background: none; border: 0; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--surface-2); }
  .row.compact { min-height: 52px; padding: 10px 16px; }

  .emoji {
    position: relative;
    width: 42px; height: 42px; flex: none;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 22px;
  }
  .badge {
    position: absolute; right: -5px; bottom: -5px;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 7px; border: 2px solid var(--surface);
    background: var(--accent); color: var(--accent-ink);
  }
  .row-text { flex: 1; min-width: 0; }
  .row-name, .row-sub, .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-name { font-size: 16px; font-weight: 600; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  /* Long description is cut with … but the item count after it stays visible. */
  .sub-split { display: flex; }
  .sub-split > span:last-child { flex: none; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); opacity: 0.6; display: grid; }
  .check { color: var(--accent); display: grid; flex: none; }

  .hint { font-size: 14px; color: var(--muted); margin: 0 2px 14px; line-height: 1.45; }

  .btn {
    flex: 1; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface);
    font-size: 16px; font-weight: 600;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { flex: 1.5; background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--glow); }
  .btn.ghost { margin-top: 12px; flex: none; width: 100%; color: var(--accent); background: transparent; border-style: dashed; }
  .btn.sm { height: 48px; flex: none; padding: 0 20px; border-radius: 12px; }
  .btn[aria-disabled="true"], .linkbtn[aria-disabled="true"] { opacity: 0.45; }
  .btn.danger { background: var(--danger); color: #FFFFFF; border-color: transparent; }
  .ask-text { white-space: pre-line; margin-bottom: 20px; }

  /* Wheel toggle: a switch inside a normal button */
  .switch { position: relative; width: 36px; height: 22px; flex: none; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); transition: background 0.2s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.2s ease, background 0.2s ease; }
  .toggle[aria-checked="true"] .switch { background: var(--accent); border-color: transparent; }
  .toggle[aria-checked="true"] .switch::after { transform: translateX(14px); background: var(--accent-ink); }
  /* Category on/off switch in Edit multiple */
  .catsw { flex: none; display: grid; place-items: center; padding: 12px 4px; margin: -12px 0; background: none; border: 0; cursor: pointer; }
  .row.off .row-text { opacity: 0.45; }
  .group-hint { margin: 10px 4px 16px; font-size: 13px; }

  /* ---------- Top bar (result + edit) ---------- */
  /* Pinned to the top of the screen. It runs edge to edge (and up under the
     status bar) with the page's own background, so content scrolls under it. */
  .topbar {
    position: sticky; top: 0; z-index: 4;
    display: flex; align-items: center; gap: 6px;
    height: calc(64px + env(safe-area-inset-top));
    margin: calc(-1 * env(safe-area-inset-top)) -16px 0;
    padding: calc(8px + env(safe-area-inset-top)) 10px 0;
    background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 60%) fixed, var(--bg);
  }
  .top-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }

  /* ---------- Result screen ---------- */
  .stage {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px 8px;
    text-align: center;
  }
  .answer {
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.08;
    text-wrap: balance;
    overflow-wrap: anywhere;
    text-shadow: var(--text-glow);
    animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .answer.s { font-size: clamp(42px, 13vw, 68px); }
  .answer.m { font-size: clamp(32px, 10vw, 50px); }
  .answer.l { font-size: clamp(26px, 7.5vw, 38px); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  /* ---------- Spinning wheel (when the Wheel toggle is on) ----------
     Circus marquee: bright slices, a gold rim of chasing bulbs, light rays
     and a color-cycling glow behind. Same colors in light and dark mode. */
  .stage.spin { overflow: hidden; }
  .wheel { position: relative; width: min(84vw, 340px, 50vh); aspect-ratio: 1; animation: wheel-in 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes wheel-in { from { transform: scale(0.3) rotate(-40deg); opacity: 0; } }
  .wheel > * { position: absolute; }
  .wheel-rays {
    inset: -32%; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255, 195, 0, 0.22) 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(closest-side, #000 35%, transparent);
            mask: radial-gradient(closest-side, #000 35%, transparent);
    animation: rays 16s linear infinite;
  }
  .wheel-glow {
    inset: -12%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 70, 90, 0.55), rgba(255, 195, 0, 0.25) 55%, transparent);
    animation: glow 1.6s ease-in-out infinite alternate, hue 5s linear infinite;
  }
  .wheel.spinning .wheel-rays { animation-duration: 3s; }
  .wheel.won .wheel-glow { animation: glow 0.25s ease-in-out infinite alternate, hue 1s linear infinite; }
  @keyframes rays { to { transform: rotate(1turn); } }
  @keyframes glow { from { opacity: 0.55; transform: scale(0.94); } to { opacity: 1; transform: scale(1.06); } }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  .wheel-disc { top: 6%; left: 6%; width: 88%; height: 88%; }
  .wheel-disc .sh { stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.5; }
  .wheel-disc .c0 .sh { fill: #E63946; }
  .wheel-disc .c1 .sh { fill: #FFC300; }
  .wheel-disc .c2 .sh { fill: #2667FF; }
  .wheel-disc .c3 .sh { fill: #FF7A00; }
  .wheel-disc .c4 .sh { fill: #8E3CCB; }
  .wheel-disc .c5 .sh { fill: #1E9E5A; }
  .wheel-disc text { fill: #FFFFFF; font-weight: 700; paint-order: stroke; stroke: rgba(0, 0, 0, 0.2); stroke-width: 2px; }
  .wheel-disc .c1 text, .wheel-disc .c3 text { fill: #2A1600; stroke: rgba(255, 255, 255, 0.3); }
  .wheel-disc g { transition: opacity 0.3s ease; }
  .wheel.won .wheel-disc g:not(.win) { opacity: 0.4; }
  .wheel-disc .win .sh { stroke: #FFFFFF; stroke-width: 4; }

  .wheel-frame { inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
  .bulb { --d: 0.9s; fill: #FFF6C8; animation: bulb var(--d) steps(1) infinite; }
  .bulb:nth-child(even) { animation-delay: calc(var(--d) / -2); }
  .wheel.spinning .bulb { --d: 0.22s; }
  .wheel.won .bulb { animation: flash 0.18s steps(1) infinite; }
  @keyframes bulb { 50% { fill: #7A5200; } }
  @keyframes flash { 50% { fill: #FF4D6D; } }

  /* Pointer sits at 3 o'clock, pointing left at the wheel. */
  .wheel-pointer { top: 43.5%; right: -6%; width: 17%; transform-origin: 70% 50%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4)); }

  /* The answer zooms in after the wheel stops. */
  .answer.reveal { animation: reveal 0.6s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes reveal { from { opacity: 0; transform: scale(0.2); filter: blur(8px); } }

  .confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; }
  .empty-title { margin: 0; font-size: 22px; font-weight: 700; }
  .empty-text { margin: -12px 0 0; font-size: 15px; color: var(--muted); }

  .actions { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 18px; }
  .btn-row { display: flex; gap: 10px; }
  .linkbtn {
    align-self: center; height: 44px; padding: 0 14px;
    display: flex; align-items: center; gap: 8px;
    background: none; border: 0; border-radius: 12px;
    color: var(--muted); font-size: 14px; font-weight: 500;
  }
  .linkbtn:active { background: var(--surface-2); }

  /* ---------- Multiple result: one row per category ---------- */
  .combo { width: 100%; text-align: left; }
  .combo-row { display: flex; align-items: center; padding-right: 6px; }
  .combo-row + .combo-row { border-top: 1px solid var(--line); }
  .combo-row.locked { background: var(--accent-soft); }
  .combo-main { flex: 1; min-width: 0; display: block; padding: 14px 6px 14px 18px; background: none; border: 0; text-align: left; }
  .combo-main:active { background: var(--surface-2); }
  .combo-cat { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combo-val { display: block; margin-top: 3px; font-size: clamp(22px, 6.4vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .lockbtn { color: var(--muted); }
  .combo-row .grip { margin-left: -4px; }
  .combo-row.locked .lockbtn { color: var(--accent); }
  .combo.reveal .combo-row { animation: row-in 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both; animation-delay: calc(var(--k) * 70ms); }
  @keyframes row-in { from { opacity: 0; transform: scale(0.8); filter: blur(6px); } }
  .combo-hint { margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }

  /* Slot machine (Reels toggle on): a gold marquee frame with chasing bulbs,
     a color stripe per category and a reel window that spins. */
  .slots { position: relative; width: 100%; animation: slots-in 0.5s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes slots-in { from { transform: scale(0.6); opacity: 0; } }
  .slots-glow {
    position: absolute; inset: -12% -6%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 70, 90, 0.55), rgba(255, 195, 0, 0.25) 55%, transparent);
    animation: glow 1.6s ease-in-out infinite alternate, hue 5s linear infinite;
  }
  .slots.won .slots-glow { animation: glow 0.25s ease-in-out infinite alternate, hue 1s linear infinite; }
  .slots-frame {
    position: relative; padding: 14px; border-radius: 28px;
    background: linear-gradient(135deg, #FFE7A0, #E0A100 50%, #9C6400);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  .slots .combo { position: relative; border: 0; border-radius: 16px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.25); }
  .slots .combo-row { box-shadow: inset 6px 0 var(--c); }
  .slots .combo-main { padding-top: 7px; padding-bottom: 7px; } /* keeps the machine about as tall as the plain result */
  .slots .combo-val { margin-top: 1px; }
  .bulbs { position: absolute; inset: 0; pointer-events: none; }
  .bulbs i {
    --d: 0.22s;
    position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #FFF6C8; box-shadow: 0 0 6px #FFE7A0;
    animation: bulb-dot var(--d) steps(1) infinite;
  }
  .bulbs i:nth-child(even) { animation-delay: calc(var(--d) / -2); }
  .slots.won .bulbs i { animation: flash-dot 0.18s steps(1) infinite; }
  @keyframes bulb-dot { 50% { background: #7A5200; box-shadow: none; } }
  @keyframes flash-dot { 50% { background: #FF4D6D; box-shadow: 0 0 8px #FF4D6D; } }

const isMulti = (l) => l.type === "multi";

  const l = c.link && findList(c.link);
  return l && !isMulti(l) ? l : null;

  const l = linkedList(c);
  return [...new Set([...(l ? l.items : []), ...c.items])];

  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;

// so a reroll replaces it (history keeps what you ended on, not every roll).
// `spin` = show the wheel landing on it before showing the answer.
let cur = null;

function roll(list) {
  const p = list.items;
  cur.item = p.length ? p[rand(p.length)] : null;
  cur.spin = !!db.wheel;

}

function record(list) {
  const h = db.history[list.id] || (db.history[list.id] = []);
  const v = isMulti(list) ? (Object.keys(cur.picks).length ? { ...cur.picks } : null) : cur.item;

  cur.rec = !!v;
  if (v) h.unshift(v);

  for (const c of liveCats(list)) {

  cur.picks = picks;
  cur.spin = !keepValid && !!db.wheel;

const SPIN_MS = 4000;

function wheelSVG(items) {
  const n = items.length, R = 150, s = 360 / n, P = WHEEL_COLORS.length;

// Sound effects, made in the browser (no audio files).
let actx;
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function tone(freq, at, dur, type = "triangle", vol = 0.15, toFreq) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
const sfx = {
  start: () => tone(180, 0, 0.45, "sawtooth", 0.06, 900), // whoosh up
  tick: () => tone(1500 + Math.random() * 300, 0, 0.035, "square", 0.04),
  win: () => {
    // Circus "ta-da": quick arpeggio up to a held chord, plus a sparkle on top.
    [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.09, 0.18, "square", 0.07));
    [1046.5, 1318.5, 1568].forEach((f) => tone(f, 0.27, 0.8, "triangle", 0.1));
    [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, 0.35 + i * 0.06, 0.12, "sine", 0.05));
  },
};

// Confetti bursting out of the wheel's center.
function confetti(from) {
  const r = from.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const box = document.createElement("div");
  box.className = "confetti";
  for (let k = 0; k < 60; k++) {
    const p = document.createElement("i");
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.background = WHEEL_COLORS[k % WHEEL_COLORS.length];
    box.append(p);
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 180, spinDeg = (Math.random() - 0.5) * 1080;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
    p.animate([
      { transform: "translate(-50%, -50%) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy - 60}px) rotate(${spinDeg / 2}deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${dx * 1.3}px, ${dy + 320}px) rotate(${spinDeg}deg)`, opacity: 0 },
    ], { duration: 1400 + Math.random() * 700, easing: "cubic-bezier(0.2, 0.6, 0.4, 1)", fill: "forwards" });
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 2300);
}

// Spin so the picked item's slice stops at the pointer: click as each slice
// passes, then lights, fanfare and confetti while zooming in on the winner,
// zoom the wheel out and show the answer.
function spin(list) {
  const wheel = $(".wheel"), disc = $(".wheel-disc"), pointer = $(".wheel-pointer");
  const i = list.items.indexOf(cur.item), s = 360 / list.items.length;
  // Slice centers are measured clockwise from 12 o'clock; the pointer is at 3 o'clock (90°).
  const turn = 360 * 6 + 90 - (i + 0.5) * s + (Math.random() - 0.5) * 0.7 * s;
  const me = cur, token = (cur.spinToken = {});
  const done = () => cur === me && me.spinToken === token;

  wheel.classList.add("spinning");
  sfx.start();
  const anim = disc.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${turn}deg)` }],
    { duration: SPIN_MS, easing: "cubic-bezier(0.15, 0.85, 0.15, 1)", fill: "forwards" });

  // Which slice is under the pointer right now; click and flick the pointer when it changes.
  let under = 0, lastTick = 0;
  (function watch() {
    if (!done() || anim.playState === "finished") return;
    const m = new DOMMatrix(getComputedStyle(disc).transform);
    const deg = ((Math.atan2(m.b, m.a) * 180) / Math.PI + 360) % 360;
    const now = Math.floor((((90 - deg) % 360) + 360) % 360 / s);
    if (now !== under && performance.now() - lastTick > 30) {
      under = now;
      lastTick = performance.now();
      sfx.tick();
      pointer.animate([{ transform: "rotate(-18deg)" }, { transform: "rotate(0deg)" }], { duration: 120, easing: "ease-out" });
    }
    requestAnimationFrame(watch);
  })();

  anim.finished.then(() => {
    if (!done()) return;
    wheel.classList.replace("spinning", "won");
    disc.querySelector(`[data-i="${i}"]`).classList.add("win");
    sfx.win();
    confetti(wheel);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    // Zoom in on the winning slice's label (right half of the wheel, by the
    // pointer) so it can be read, hold, then zoom back out.
    const close = "translateX(-43%) scale(1.8)";
    wheel.animate([{ transform: "none" }, { transform: close }], { duration: 650, easing: "cubic-bezier(0.3, 1.25, 0.5, 1)", fill: "forwards" });
    setTimeout(() => {
      if (!done()) return;
      wheel.animate([{ transform: close, opacity: 1 }, { transform: "scale(0.3)", opacity: 0 }], { duration: 320, easing: "ease-in", fill: "forwards" })
        .finished.then(() => {
          if (!done()) return;
          me.spin = false;
          me.reveal = true;
          if (route().view === "list") render();
        }, () => {});
    }, 2000);
  }, () => {});
}

// Multiple with the toggle on: a slot machine with one reel per unlocked
// category. Reels start on the last answer, spin and stop one by one, top
// to bottom, inside a gold marquee frame, then fanfare and the answer.
const sfxStop = () => tone(320, 0, 0.09, "square", 0.07, 140); // reel "clunk"

function placeBulbs(el) {
  const w = el.offsetWidth, h = el.offsetHeight, m = 7, gap = 22;
  const nx = Math.max(2, Math.round((w - 2 * m) / gap)), ny = Math.max(2, Math.round((h - 2 * m) / gap));
  const pts = [];
  for (let i = 0; i < nx; i++) pts.push([m + ((w - 2 * m) * i) / nx, m]);
  for (let i = 0; i < ny; i++) pts.push([w - m, m + ((h - 2 * m) * i) / ny]);
  for (let i = 0; i < nx; i++) pts.push([w - m - ((w - 2 * m) * i) / nx, h - m]);
  for (let i = 0; i < ny; i++) pts.push([m, h - m - ((h - 2 * m) * i) / ny]);
  el.innerHTML = pts.map(([x, y]) => `<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></i>`).join("");
}

function slotSpin(list, reels) {
  const box = $(".slots"), me = cur, token = (cur.spinToken = {});
  const done = () => cur === me && me.spinToken === token;
  placeBulbs($(".bulbs"));
  box.classList.add("spinning");
  sfx.start();

  const runs = reels.map((c, k) => {
    const win = $(`.reel[data-cat="${c.id}"]`), strip = win.firstElementChild, h = win.offsetHeight;
    const o = catOptions(c), pick = me.picks[c.id], other = () => o.find((x) => x !== pick);
    const seq = [o.includes(me.before[c.id]) ? me.before[c.id] : o[rand(o.length)]];
    const len = 14 + k * 5;
    while (seq.length < len - 1) {
      let x;
      do x = o[rand(o.length)]; while (x === seq[seq.length - 1]);
      seq.push(x);
    }
    if (seq[seq.length - 1] === pick) seq[seq.length - 1] = other();
    seq.push(pick, other()); // the one after shows in the little bounce
    strip.innerHTML = seq.map((x) => `<span>${esc(x)}</span>`).join("");
    const anim = strip.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-(len - 1) * h}px)` }],
      { duration: 1500 + k * 550, easing: "cubic-bezier(0.25, 0.75, 0.3, 1.04)", fill: "forwards" });
    anim.finished.then(() => {
      if (!done()) return;
      sfxStop();
      win.closest(".combo-row").classList.add("landed");
      if (navigator.vibrate) navigator.vibrate(8);
    }, () => {});
    return { strip, h, anim, at: 0 };
  });

  // Click as options pass under each reel's window.
  let lastTick = 0;
  (function watch() {
    if (!done()) return;
    let moving = false;
    for (const r of runs) {
      if (r.anim.playState === "finished") continue;
      moving = true;
      const at = Math.round(-new DOMMatrix(getComputedStyle(r.strip).transform).f / r.h);
      if (at !== r.at) {
        r.at = at;
        if (performance.now() - lastTick > 35) { lastTick = performance.now(); sfx.tick(); }
      }
    }
    if (moving) requestAnimationFrame(watch);
  })();

  Promise.all(runs.map((r) => r.anim.finished)).then(() => {
    if (!done()) return;
    box.classList.replace("spinning", "won");
    sfx.win();
    confetti(box);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    box.animate([{ transform: "scale(1)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: 500, easing: "cubic-bezier(0.3, 1.5, 0.5, 1)" });
    setTimeout(() => {
      if (!done()) return;
      box.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(0.92)" }], { duration: 220, easing: "ease-in", fill: "forwards" })
        .finished.then(() => {
          if (!done()) return;
          me.spin = false;
          me.reveal = true;
          if (route().view === "list") render();
        }, () => {});
    }, 1500);
  }, () => {});
}

function renderResult(list) {
  if (!cur || cur.id !== list.id) {
    cur = { id: list.id, item: null, rec: false };
    roll(list);
  } else if (cur.item && !list.items.includes(cur.item)) {
    roll(list); // item was renamed or deleted while editing
  }

  // No point spinning a wheel with one slice, and skip it if the phone asks for less motion.
  if (cur.spin && (list.items.length < 2 || reducedMotion())) cur.spin = false;
  const spinning = cur.spin;
  const size = (s) => (s.length <= 12 ? "s" : s.length <= 26 ? "m" : "l");

  let stage;
  if (!list.items.length) {
    stage = `
      <p class="empty-title">This list is empty</p>
      <p class="empty-text">Add a few options first.</p>
      <button class="btn primary sm" data-act="edit">Add items</button>`;
  } else if (spinning) {
    stage = wheelSVG(list.items);
  } else {
    stage = `<p class="answer ${size(cur.item)}${cur.reveal ? " reveal" : ""}">${esc(cur.item)}</p>` +
      badgePills(badgesOf(list, cur.item), `answer-badges${cur.reveal ? " reveal" : ""}`);
    cur.reveal = false;
  }

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title"><span class="top-icon">${icon(list)}</span><span class="ellip">${esc(list.name)}</span></div>
        <button class="iconbtn" data-act="edit" aria-label="Edit list">${I.edit}</button>
      </div>
      <section class="stage${spinning ? " spin" : ""}" aria-live="polite">${stage}</section>
      ${list.items.length ? `
      <div class="actions">
        <button class="linkbtn" data-act="pick" ${spinning ? 'aria-disabled="true"' : ""}>${I.hand} Pick by hand</button>
        <div class="btn-row">
          <button class="btn toggle" data-act="wheel" role="switch" aria-checked="${!!db.wheel}"><span class="switch" aria-hidden="true"></span> Wheel</button>
          <button class="btn primary" data-act="reroll" ${spinning ? 'aria-disabled="true"' : ""}>${I.reroll} Reroll</button>
        </div>
      </div>` : ""}
    </main>`;
  if (spinning) spin(list);
}

// Multiple: one row per category with its pick. Tap a row to choose it
// yourself; the lock keeps it when you reroll (until you leave this screen).
function renderCombo(list) {
  if (!cur || cur.id !== list.id) {
    cur = { id: list.id, picks: {}, locks: new Set(), rec: false };
    rollCombo(list);
  } else if (comboStale(list)) {
    rollCombo(list, true); // a category changed while editing
  }

  const live = liveCats(list);
  const reels = live.filter((c) => !cur.locks.has(c.id) && catOptions(c).length > 1);
  if (cur.spin && (!reels.length || reducedMotion())) cur.spin = false;
  const spinning = cur.spin;
  const off = spinning ? 'aria-disabled="true"' : "";

  const rows = live.map((c, k) => {
    const locked = cur.locks.has(c.id);
    const val = spinning && reels.includes(c)
      ? `<span class="combo-val reel" data-cat="${c.id}"><span class="strip"><span>${esc(cur.picks[c.id])}</span></span></span>`
      : `<span class="combo-val">${esc(cur.picks[c.id])}</span>${badgePills(optionBadges(list, c, cur.picks[c.id]))}`;
    return `
      <div class="combo-row${locked ? " locked" : ""}" data-cat="${c.id}" style="--k:${k};--c:${WHEEL_COLORS[k % WHEEL_COLORS.length]}">
        <button class="combo-main" data-act="pickCat" data-cat="${c.id}" ${off}>
          <span class="combo-cat">${esc(c.name)}</span>
          ${val}
        </button>
        <button class="iconbtn lockbtn" data-act="lock" data-cat="${c.id}" aria-pressed="${locked}" aria-label="${locked ? "Unlock" : "Lock"} ${esc(c.name)}" ${off}>${locked ? I.lock : I.unlock}</button>
        ${spinning ? "" : grip}
      </div>`;
  }).join("");

  let stage;
  if (!live.length) {
    const allOff = list.cats.some((c) => c.off && catOptions(c).length);
    stage = allOff ? `
      <p class="empty-title">All categories are off</p>
      <p class="empty-text">Turn one on in Edit to include it in the roll.</p>
      <button class="btn primary sm" data-act="edit">Edit categories</button>` : `
      <p class="empty-title">Nothing to pick yet</p>
      <p class="empty-text">Add a category with a few options.</p>
      <button class="btn primary sm" data-act="edit">Add categories</button>`;
  } else {
    // Drag a row (handle, or press and hold) to change the category order.
    const combo = `<div class="group combo${cur.reveal ? " reveal" : ""}"${spinning ? "" : ' data-sort="combo"'}>${rows}</div>`;
    stage = spinning
      ? `<div class="slots"><div class="slots-glow"></div><div class="slots-frame"><div class="bulbs"></div>${combo}</div></div>`
      : combo;
    cur.reveal = false;
  }

  app.innerHTML = `
    <main class="view">
      <div class="topbar">
        <button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button>
        <div class="top-title"><span class="top-icon">${icon(list)}</span><span class="ellip">${esc(list.name)}</span></div>
        <button class="iconbtn" data-act="edit" aria-label="Edit multiple">${I.edit}</button>
      </div>
      <section class="stage combo-stage${spinning ? " spin" : ""}" aria-live="polite">${stage}</section>
      ${live.length ? `
      <div class="actions">
        <p class="combo-hint">Tap a result to choose it yourself</p>
        <div class="btn-row">
          <button class="btn toggle" data-act="wheel" role="switch" aria-checked="${!!db.wheel}"><span class="switch" aria-hidden="true"></span> Reels</button>
          <button class="btn primary" data-act="reroll" ${off}>${I.reroll} Reroll</button>
        </div>
      </div>` : ""}
    </main>`;
  if (spinning) slotSpin(list, reels);
}

// Our own "Are you sure?" sheet. The browser's confirm() box doesn't show
// in some installed apps and previews (it just answers Cancel).
// Resolves true for the main button; false for Cancel, a backdrop tap or Back.
let asking = null;
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
function ask(title, text, ok) {
  return new Promise((resolve) => {
    asking = { title, text, ok, resolve };
    openSheet("confirm");
  });
}
function answer(yes) {
  const a = asking;
  asking = null;
  addEventListener("popstate", () => a.resolve(yes), { once: true }); // after the sheet has closed
  history.back();
}

let shownSheet = null;
// `again`: redraw the sheet that is already open (no slide-up, same scroll).
function renderSheet(again) {
  const kind = history.state && history.state.sheet;
  const el = $("#sheet");
  if (asking && kind !== "confirm" && shownSheet === "confirm") { asking.resolve(false); asking = null; }
  if (kind === shownSheet && !again) return;
  const keepScroll = again && el.querySelector(".panel") ? el.querySelector(".panel").scrollTop : 0;
  shownSheet = kind || null;
  document.body.style.overflow = kind ? "hidden" : "";
  if (!kind) { el.hidden = true; el.innerHTML = ""; return; }

  let body = "";
  if (kind === "menu") {
    body = `
      <h2 class="sheet-title">Menu</h2>
      <div class="group">
        <button class="row" data-act="menuNew"><span class="menu-icon">${I.plus}</span><span class="row-text"><div class="row-name">Add a list</div><div class="row-sub">New list or Multiple</div></span></button>
        <button class="row" data-act="manage"><span class="menu-icon">${I.lists}</span><span class="row-text"><div class="row-name">Edit lists</div><div class="row-sub">Add, rename, reorder, delete</div></span></button>
        <button class="row" data-act="export"><span class="menu-icon">${I.download}</span><span class="row-text"><div class="row-name">Back up</div><div class="row-sub">Save a backup file to Downloads</div></span></button>
        <button class="row" data-act="import"><span class="menu-icon">${I.upload}</span><span class="row-text"><div class="row-name">Restore from backup</div><div class="row-sub">Replace lists with a backup file</div></span></button>
      </div>
      <p class="foot">Your lists are saved on this phone only.<br>Back up now and then.</p>`;
  } else if (kind === "pick") {
    const list = cur && findList(cur.id);
    if (!list) { el.hidden = true; return; }
    const rows = list.items.map((it, i) => `
        <button class="row compact" data-act="choose" data-i="${i}">
          <span class="row-text"><div class="row-name">${esc(it)}</div>${badgePills(badgesOf(list, it))}</span>
          ${it === cur.item ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `<h2 class="sheet-title">${icon(list)} Pick by hand</h2><div class="group">${rows}</div>`;
  } else if (kind === "confirm") {
    if (!asking) { el.hidden = true; return; }
    body = `
      <h2 class="sheet-title">${esc(asking.title)}</h2>
      <p class="hint ask-text">${esc(asking.text)}</p>
      <div class="btn-row">
        <button class="btn" data-act="askNo">Cancel</button>
        <button class="btn danger" data-act="askYes">${esc(asking.ok)}</button>
      </div>`;
  } else if (kind === "labels") {
    const list = currentList();
    if (!list) { el.hidden = true; return; }
    const mine = list.labels || [], all = allLabels();
    const rows = all.map((s) => `
        <button class="row compact" data-act="toggleLabel" data-v="${esc(s)}">
          <span class="row-text">${labelPill(s)}</span>
          ${mine.includes(s) ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `
      <h2 class="sheet-title">Labels</h2>
      <p class="hint">Filter by label on the Home screen.</p>
      <form class="addbar inline" data-form="label">
        <input class="input" id="labelInput" placeholder="New label…" maxlength="24" enterkeyhint="done" autocomplete="off">
        <button class="btn primary sm" type="submit">Add</button>
      </form>
      ${all.length ? `<div class="label sheet-label">Tap to add or remove</div><div class="group">${rows}</div>` : ""}`;
  } else if (kind === "badges") {
    const owner = editOwner();
    if (!owner || !owner.items.includes(badgeItem)) { el.hidden = true; return; }
    const mine = badgesOf(owner, badgeItem);
    // Badges un-ticked while the sheet is open stay listed, so they can be ticked again.
    seenBadges = [...new Set([...seenBadges, ...allBadges(owner)])];
    const all = [...seenBadges].sort((a, b) => a.localeCompare(b));
    const rows = all.map((s) => `
        <button class="row compact" data-act="toggleBadge" data-v="${esc(s)}">
          <span class="row-text">${badgePills([s])}</span>
          ${mine.includes(s) ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `
      <h2 class="sheet-title">Badges · ${esc(badgeItem)}</h2>
      <p class="hint">Shown with this option when it's picked. Start with + for green or − for red, e.g. +10% Atk.</p>
      <form class="addbar inline" data-form="badge">
        <input class="input" id="badgeInput" placeholder="New badge…" maxlength="24" enterkeyhint="done" autocomplete="off">
        <button class="btn primary sm" type="submit">Add</button>
      </form>
      ${all.length ? `<div class="label sheet-label">Used in this ${route().view === "cat" ? "category" : "list"} · tap to add or remove</div><div class="group">${rows}</div>` : ""}`;
  } else if (kind === "sort") {
    const on = db.view.sort || "custom";
    const rows = [["custom", "My order", "Drag lists to arrange them"], ["az", "Name A–Z", ""], ["new", "Newest first", "By date created"], ["old", "Oldest first", "By date created"]]
      .map(([v, name, sub]) => `
        <button class="row compact" data-act="setSort" data-v="${v}">
          <span class="row-text"><div class="row-name">${name}</div>${sub ? `<div class="row-sub">${sub}</div>` : ""}</span>
          ${on === v ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `<h2 class="sheet-title">Sort lists</h2><div class="group">${rows}</div>`;
  } else if (kind === "icon") {
    const list = currentList();
    if (!list) { el.hidden = true; return; }
    body = `
      <h2 class="sheet-title">Icon</h2>
      <div class="name-row">
        <input class="input" data-field="emoji" value="${esc(list.emoji)}" placeholder="Type an emoji" aria-label="Emoji" enterkeyhint="done">
      </div>
      <div class="group">
        <button class="row" data-act="uploadImg"><span class="menu-icon">${I.image}</span><span class="row-text"><div class="row-name">${list.image ? "Change image" : "Upload image"}</div><div class="row-sub">Use a photo or picture from this phone</div></span></button>
        ${list.image ? `<button class="row" data-act="removeImg"><span class="menu-icon">${I.x}</span><span class="row-text"><div class="row-name">Remove image</div><div class="row-sub">Show the emoji instead</div></span></button>` : ""}
      </div>`;
  } else if (kind === "new") {
    body = `
      <h2 class="sheet-title">New randomizer</h2>
      <div class="group">
        <button class="row" data-act="newList" data-type="single"><span class="menu-icon">${I.hand}</span><span class="row-text"><div class="row-name">List</div><div class="row-sub">Pick one option from a list</div></span></button>
        <button class="row" data-act="newList" data-type="multi"><span class="menu-icon">${I.layers}</span><span class="row-text"><div class="row-name">Multiple</div><div class="row-sub">Pick one option from each category</div></span></button>
      </div>`;
  } else if (kind === "pickCat") {
    const list = cur && findList(cur.id), c = list && isMulti(list) && list.cats.find((x) => x.id === cur.pickCat);
    if (!c) { el.hidden = true; return; }
    const rows = catOptions(c).map((it, i) => `
        <button class="row compact" data-act="chooseCat" data-i="${i}">
          <span class="row-text"><div class="row-name">${esc(it)}</div>${badgePills(optionBadges(list, c, it))}</span>
          ${it === cur.picks[c.id] ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `<h2 class="sheet-title">${esc(c.name)}</h2><p class="hint">Your choice stays locked when you reroll.</p><div class="group">${rows}</div>`;
  } else if (kind === "link") {
    const c = currentCat();
    if (!c) { el.hidden = true; return; }
    const lists = db.lists.filter((l) => !isMulti(l));
    const rows = [{ id: "", emoji: "", name: "Don't link a list", items: null }, ...lists].map((l) => `
        <button class="row compact" data-act="setLink" data-id="${l.id}">
          <span class="row-text"><div class="row-name">${l.emoji ? icon(l) + " " : ""}${esc(l.name)}</div>${l.items ? `<div class="row-sub">${l.items.length} items</div>` : ""}</span>
          ${(c.link || "") === l.id ? `<span class="check">${I.check}</span>` : ""}
        </button>`).join("");
    body = `<h2 class="sheet-title">Link a list</h2><p class="hint">Its options are used in this category and stay in sync when you edit that list.</p><div class="group">${rows}</div>`;
  }

  el.innerHTML = `
    <div class="backdrop${again ? " still" : ""}" data-act="closeSheet"></div>
    <div class="panel${again ? " still" : ""}" role="dialog" aria-modal="true">
      <div class="handle"></div>
      <div class="sheet-x-wrap"><button class="iconbtn sheet-x" data-act="${kind === "confirm" ? "askNo" : "closeSheet"}" aria-label="Close">${I.x}</button></div>
      ${body}
    </div>`;
  el.hidden = false;
  if (again) el.querySelector(".panel").scrollTop = keepScroll;
}

/* =========================================================
   6. What each button does
   ========================================================= */
const currentList = () => findList(route().id);
const currentCat = () => {
  const l = currentList();
  return l && isMulti(l) ? l.cats.find((c) => c.id === route().sub) : null;
};
// The options being edited: a list's items, or a category's own options.
const editItems = () => (route().view === "cat" ? currentCat().items : currentList().items);
// What holds those options (and their badges): the category, or the list.
const editOwner = () => (route().view === "cat" ? currentCat() : currentList());
let badgeItem = null; // the option whose Badges sheet is open
let seenBadges = []; // badges listed in that sheet since it opened

function uniqueName(name, exceptId) {
  const base = name.trim() || "Untitled";
  const taken = new Set(db.lists.filter((l) => l.id !== exceptId).map((l) => l.name));
  let n = base, k = 2;
  while (taken.has(n)) n = `${base} ${k++}`;
  return n;
}

const actions = {
  open: (el) => go("/list/" + el.dataset.id),
  openEdit: (el) => go("/edit/" + el.dataset.id),
  menu: () => openSheet("menu"),
  back: () => {
    // Don't lose an item that was typed but not yet added.
    const add = $("#addInput"), r = route();
    if (add && add.value.trim()) { editItems().push(add.value.trim()); save(); }
    back(r.view === "cat" ? "/edit/" + r.id : "/");
  },
  done: () => back("/"),
  edit: () => go("/edit/" + route().id),
  closeSheet,

  reroll: () => {
    const list = currentList();
    if (isMulti(list)) {
      if (liveCats(list).every((c) => cur.locks.has(c.id))) return toast("Everything is locked");
      rollCombo(list);
    } else {
      roll(list);
    }
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  },
  lock: (el) => {
    if (cur.spin) return;
    const id = el.dataset.cat;
    cur.locks.has(id) ? cur.locks.delete(id) : cur.locks.add(id);
    render();
  },
  pickCat: (el) => {
    if (cur.spin) return;
    cur.pickCat = el.dataset.cat;
    openSheet("pickCat");
  },
  chooseCat: (el) => {
    const list = findList(cur.id), c = list.cats.find((x) => x.id === cur.pickCat);
    cur.picks[c.id] = catOptions(c)[+el.dataset.i];
    cur.locks.add(c.id); // choosing by hand also locks it
    record(list);
    closeSheet();
  },
  wheel: (el) => {
    db.wheel = !db.wheel;
    save();
    el.setAttribute("aria-checked", db.wheel);
  },
  pick: () => openSheet("pick"),
  choose: (el) => {

    record(list);
    closeSheet();
  },

  manage: () => {

  },
  up: (el) => move(+el.dataset.i, -1),
  down: (el) => move(+el.dataset.i, 1),
  labelSheet: () => openSheet("labels"),
  toggleLabel: (el) => {
    const list = currentList(), s = el.dataset.v;
    const labels = (list.labels || []).includes(s) ? list.labels.filter((x) => x !== s) : [...(list.labels || []), s];
    setLabels(list, labels);
  },
  badgeSheet: (el) => {
    badgeItem = editItems()[+el.dataset.i];
    seenBadges = [];
    openSheet("badges");
  },
  toggleBadge: (el) => {
    const owner = editOwner(), s = el.dataset.v, b = badgesOf(owner, badgeItem);
    setBadges(owner, badgeItem, b.includes(s) ? b.filter((x) => x !== s) : [...b, s]);
    save();
    render();
    renderSheet(true);
  },
  sortSheet: () => openSheet("sort"),
  setSort: (el) => {
    db.view.sort = el.dataset.v;
    save();
    closeSheet();
  },
  filterLabel: (el) => {
    db.view.label = el.dataset.v || null;
    save();
    render();
  },
  clearFilters: () => {
    homeQuery = "";
    db.view.label = null;
    save();
    render();
  },
  askYes: () => answer(true),
  askNo: () => answer(false),
  iconSheet: () => openSheet("icon"),
  uploadImg: () => $("#imgFile").click(),
  removeImg: () => {
    delete currentList().image;
    save();
    closeSheet();
  },
  newPick: () => openSheet("new"),
  // Swap the open menu for the "New randomizer" sheet, so Back returns home.
  menuNew: () => {
    history.replaceState({ d: depth(), sheet: "new" }, "", location.hash);
    render();
  },
  newList: (el) => {
    const l = el.dataset.type === "multi"
      ? { id: uid(), name: uniqueName("New multiple"), emoji: MULTI_EMOJI, type: "multi", cats: [], created: Date.now() }
      : { id: uid(), name: uniqueName("New list"), emoji: DEFAULT_EMOJI, items: [], created: Date.now() };
    db.lists.push(l);

    // Swap the open "New randomizer" sheet for the edit screen.

    name.select();

  delItem: (el) => {

  deleteList: async () => {

  },

  openCat: (el) => go(`/cat/${route().id}/${el.dataset.cat}`),
  catActive: (el) => {
    // Switched-off categories are left out of the roll (see liveCats).
    const c = currentList().cats.find((x) => x.id === el.dataset.cat);
    if (c.off) delete c.off; else c.off = true;
    save();
    render();
  },
  addCat: () => {
    const list = currentList(), c = { id: uid(), name: `Category ${list.cats.length + 1}`, items: [] };
    list.cats.push(c);
    save();
    go(`/cat/${list.id}/${c.id}`);
    const name = $('[data-field="catName"]');
    name.focus();
    name.select();
  },
  delCat: async () => {
    const list = currentList(), c = currentCat();
    if (c.items.length && !(await ask(`Delete “${c.name}”?`, `Its ${plural(c.items.length, "option")} will be deleted too.`, "Delete"))) return;
    list.cats = list.cats.filter((x) => x !== c);
    save();
    back("/edit/" + list.id);
  },
  linkSheet: () => openSheet("link"),
  setLink: (el) => {
    const c = currentCat();
    if (el.dataset.id) c.link = el.dataset.id;
    else delete c.link;
    save();
    closeSheet();
  },

  export: () => {
    closeSheet();
    exportBackup();
  },
  import: () => {
    $("#file").click();
    closeSheet();
  },
};

// Save a list's labels, then redraw its edit screen and the open Labels sheet.
function setLabels(list, labels) {
  if (labels.length) list.labels = labels;
  else delete list.labels;
  save();
  render();
  renderSheet(true);
}

// Ask, then delete a list or Multiple. Resolves true if it was deleted.
// (From its Edit screen, or by dropping it on the trash on Home.)
async function removeList(list) {
  const multi = isMulti(list);
  // Multiples that link this list keep a copy of its options.
  const users = multi ? [] : db.lists.filter((m) => isMulti(m) && m.cats.some((c) => c.link === list.id));
  const msg = (multi ? `Its ${plural(list.cats.length, "category", "categories")}` : `Its ${plural(list.items.length, "item")}`) +
    " will be deleted too." +
    (users.length ? `\n\n${users.map((m) => `“${m.name}”`).join(", ")} uses this list and will keep a copy of its options.` : "");
  if (!(await ask(`Delete “${list.name}”?`, msg, "Delete"))) return false;
  users.forEach((m) => m.cats.forEach((c) => {
    if (c.link !== list.id) return;
    c.items = [...new Set([...list.items, ...c.items])];
    if (list.badges) c.badges = { ...list.badges, ...(c.badges || {}) }; // keep its option badges too
    delete c.link;
  }));
  db.lists = db.lists.filter((l) => l.id !== list.id);
  delete db.history[list.id];
  save();
  toast(multi ? "Multiple deleted" : "List deleted");
  return true;
}

function move(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= db.lists.length) return;
  [db.lists[i], db.lists[j]] = [db.lists[j], db.lists[i]];
  save();
  render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el, e);
});

// While the wheel spins, a tap anywhere outside it skips straight to the answer.
// Reroll and Pick by hand (greyed out) only skip; Back, Edit and the Wheel
// toggle still do their job. Runs before the handler above (capture phase).
document.addEventListener("click", (e) => {
  if (!cur || !cur.spin || !$(".wheel, .slots") || e.target.closest(".wheel, .slots")) return;
  const el = e.target.closest("[data-act]");
  if (el && el.getAttribute("aria-disabled") === "true") e.stopPropagation();
  const leaving = el && (el.dataset.act === "back" || el.dataset.act === "edit");
  cur.spinToken = null; // stops the running spin's next steps
  cur.spin = false;
  cur.reveal = true;
  if (!leaving) setTimeout(() => route().view === "list" && render());
}, true);

// Editing text fields saves automatically when you leave the field.
document.addEventListener("change", (e) => {
  const f = e.target.dataset.field;
  const list = currentList();
  if (!f || !list) return;
  const v = e.target.value.trim();

  if (f === "name") {
    list.name = uniqueName(v, list.id);
    e.target.value = list.name;
  } else if (f === "emoji") {
    // Typing an emoji switches back from an uploaded image to the emoji.
    if (v) delete list.image;
    list.emoji = v || list.emoji || DEFAULT_EMOJI;
    e.target.value = list.emoji;
    save();
    return render(); // updates the screen behind the Icon sheet
  } else if (f === "description") {
    if (v) list.description = v;
    else delete list.description;
    e.target.value = v;
    autoGrow(e.target);
  } else if (f === "catName") {
    currentCat().name = v || "Category";
    e.target.value = currentCat().name;
  } else if (f === "item") {
    const i = +e.target.dataset.i, items = editItems(), owner = editOwner(), old = items[i];
    const b = badgesOf(owner, old);
    if (v) {
      items[i] = v;
      e.target.value = v;
      if (b.length && v !== old) { setBadges(owner, old, []); setBadges(owner, v, b); } // badges follow the rename
    } else {
      items.splice(i, 1);
      if (!items.includes(old)) setBadges(owner, old, []);
      save();
      return render();
    }
  }
  save();
});

// The description box grows to fit its text (Enter adds a new line there).
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + 2 + "px"; // + top and bottom border
}
document.addEventListener("input", (e) => {
  if (e.target.classList.contains("desc-in")) autoGrow(e.target);
  if (e.target.id === "search") { homeQuery = e.target.value; fillHomeList(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.field && e.target.tagName !== "TEXTAREA") e.target.blur();
  if (e.key === "Enter" && e.target.id === "search") e.target.blur(); // hide the keyboard to see results
  if (e.key === "Enter" && e.target.dataset && ["openEdit", "openCat"].includes(e.target.dataset.act)) e.target.click();
});

document.addEventListener("submit", (e) => {
  if (e.target.dataset.form === "label") {
    // New label from the Labels sheet. Reuse an existing label's spelling ("food" → "Food").
    e.preventDefault();
    const v = $("#labelInput").value.trim().replace(/\s+/g, " ");
    const list = currentList();
    if (!v || !list) return;
    const s = allLabels().find((x) => x.toLowerCase() === v.toLowerCase()) || v;
    if (!(list.labels || []).includes(s)) setLabels(list, [...(list.labels || []), s]);
    else $("#labelInput").value = "";
    $("#labelInput").focus(); // ready for the next one
    return;
  }
  if (e.target.dataset.form === "badge") {
    // New badge for the option in the Badges sheet ("-" typed as a minus sign).
    e.preventDefault();
    const owner = editOwner(), input = $("#badgeInput");
    const v = input.value.trim().replace(/\s+/g, " ").replace(/^-/, "−");
    if (!v || !owner) return;
    const b = badgesOf(owner, badgeItem);
    if (!b.includes(v)) {
      setBadges(owner, badgeItem, [...b, v]);
      save();
      render();
      renderSheet(true);
    } else input.value = "";
    $("#badgeInput").focus(); // ready for the next one
    return;
  }
  if (e.target.dataset.form !== "add") return;
  e.preventDefault();
  const input = $("#addInput");
  const v = input.value.trim();
  if (!v) return;
  editItems().push(v);
  save();
  render();
  const next = $("#addInput"); // the screen was redrawn
  next.focus();
  // Show the item you just added (it's right above the add field).
  if (e.target.classList.contains("inline")) next.scrollIntoView({ block: "center" });
  else scrollTo(0, document.body.scrollHeight);
});

/* =========================================================
   6b. Drag to reorder
   Lists: drag the ⋮⋮ handle, or press and hold a row.
   Items: drag the ⋮⋮ handle (holding a text field selects text).
   ========================================================= */
const HOLD_MS = 400;
let hold = null;          // waiting for a long-press to finish
let drag = null;          // the row being dragged
let suppressClickUntil = 0;

document.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || drag) return;
  const row = e.target.closest("[data-sort] > *");
  if (!row) return;
  if (e.target.closest(".grip")) { e.preventDefault(); startDrag(row, e.pointerId, e.clientX, e.clientY); return; }
  if (!["lists", "cats", "combo"].includes(row.parentElement.dataset.sort) || e.target.closest(".move")) return;
  const h = { row, id: e.pointerId, x: e.clientX, y: e.clientY };
  h.timer = setTimeout(() => { hold = null; startDrag(h.row, h.id, h.x, h.y); }, HOLD_MS);
  hold = h;
});

document.addEventListener("pointermove", (e) => {
  // Moving before the hold finishes means you're scrolling, not dragging.
  if (hold && e.pointerId === hold.id && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 8) cancelHold();
  // Only the finger that started the drag moves it (ignore a second finger).
  if (drag && e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; layoutDrag(); }
});
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
// Stop the page from scrolling under your finger while a row is lifted.
document.addEventListener("touchmove", (e) => { if (drag) e.preventDefault(); }, { passive: false });
// No Android long-press menu on list rows.
document.addEventListener("contextmenu", (e) => { if (drag || hold || e.target.closest('[data-sort="lists"], [data-sort="cats"], [data-sort="combo"]')) e.preventDefault(); });
// The tap that ends a drag shouldn't also open the list.
document.addEventListener("click", (e) => {
  if (performance.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
}, true);

function cancelHold() { if (hold) { clearTimeout(hold.timer); hold = null; } }
function endPointer(e) {
  if (hold && e.pointerId === hold.id) cancelHold();
  if (drag && e.pointerId === drag.id) endDrag();
}

function startDrag(row, pointerId, x, y) {
  const group = row.parentElement;
  const rows = [...group.children];
  const from = rows.indexOf(row);
  drag = { group, rows, row, from, to: from, id: pointerId, x, y, startY: y + scrollY, h: row.offsetHeight };
  try { row.setPointerCapture(pointerId); } catch (e) {}
  group.classList.add("sorting");
  row.classList.add("dragging");
  row.style.transform = "scale(1.02)";
  document.body.classList.add("is-dragging");
  if (navigator.vibrate) navigator.vibrate(15);
  requestAnimationFrame(autoScroll);
}

// On Home the "+" button turns into a trash can while a list is lifted:
// is the finger over it (with a little extra room around it)?
function overTrash() {
  const f = drag.group.dataset.sort === "lists" && $(".fab");
  if (!f) return false;
  const r = f.getBoundingClientRect(), pad = 20;
  return drag.x > r.left - pad && drag.x < r.right + pad && drag.y > r.top - pad && drag.y < r.bottom + pad;
}

// Move the lifted row with your finger and slide the others out of the way.
function layoutDrag() {
  const { rows, row, from, h } = drag;
  const dy = drag.y + scrollY - drag.startY;
  const trash = overTrash();
  if (trash !== !!drag.trash) {
    drag.trash = trash;
    $(".fab").classList.toggle("armed", trash);
    row.classList.toggle("to-trash", trash);
    if (navigator.vibrate) navigator.vibrate(trash ? 25 : 5);
  }
  row.style.transform = `translateY(${dy}px) scale(${trash ? 0.9 : 1.02})`;
  const center = row.offsetTop + h / 2 + dy;
  let to = 0;
  // Over the trash, the other rows go back to where they were.
  if (trash) to = from;
  else rows.forEach((r, i) => { if (i !== from && center > r.offsetTop + r.offsetHeight / 2) to++; });
  rows.forEach((r, i) => {
    if (i === from) return;
    const shift = from < to && i > from && i <= to ? -h : from > to && i >= to && i < from ? h : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
  if (to !== drag.to && navigator.vibrate) navigator.vibrate(5);
  drag.to = to;
}

// Scroll the page when you drag near the top or bottom edge (long lists).
function autoScroll() {
  if (!drag) return;
  if (drag.trash) return requestAnimationFrame(autoScroll); // hold still over the trash
  const edge = 90, y = drag.y;
  const speed = y < edge ? -(edge - y) / 5 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 5 : 0;
  if (speed) { scrollBy(0, speed); layoutDrag(); }
  requestAnimationFrame(autoScroll);
}

function endDrag() {
  const { group, from, to, trash } = drag;
  drag = null;
  document.body.classList.remove("is-dragging");
  suppressClickUntil = performance.now() + 400;
  if (trash) {
    // Dropped on the trash: put the row back, then ask before deleting.
    const list = db.lists[from];
    render();
    removeList(list).then((gone) => gone && render());
    return;
  }
  if (to !== from && group.dataset.sort === "combo") {
    // Result screen rows skip empty categories, so move by id and leave those where they are.
    const list = currentList(), ids = [...group.children].map((r) => r.dataset.cat);
    ids.splice(to, 0, ...ids.splice(from, 1));
    const byId = Object.fromEntries(list.cats.map((c) => [c.id, c]));
    let k = 0;
    list.cats = list.cats.map((c) => (ids.includes(c.id) ? byId[ids[k++]] : c));
    save();
  } else if (to !== from) {
    const s = group.dataset.sort;
    const arr = s === "lists" ? db.lists : s === "cats" ? currentList().cats : editItems();
    arr.splice(to, 0, ...arr.splice(from, 1));
    save();
  }
  render();
}

// Uploaded icons are cropped to a square and shrunk to 160px, so they stay
// small enough to keep on the phone (and in backups).
function squareImage(file, size = 160) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      const c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/webp", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  });
}

$("#imgFile").addEventListener("change", async (e) => {
  const file = e.target.files[0], list = currentList();
  e.target.value = "";
  if (!file || !list) return;
  try { list.image = await squareImage(file); }
  catch (err) { return toast("Couldn't open that image"); }
  save();
  if (history.state && history.state.sheet) closeSheet();
  else render();
});

/* =========================================================
   7. Backup & restore
   Same format as the old app: { "List name": [items] }.
   A list with a description, labels, option badges or image is saved as
   { "List name": { description, labels, badges, image, items } }, where badges = { "option": ["badge"] }.
   A Multiple: { "Name": { type: "multi", description, labels, image, categories: [{ name, off, link, items, badges }] } },
   where `link` is the name of the linked list.
   ========================================================= */
const backupItems = (v) => (Array.isArray(v) ? v : v && Array.isArray(v.items) ? v.items : null);
const backupMulti = (v) => v && v.type === "multi" && Array.isArray(v.categories);
const isImage = (s) => typeof s === "string" && s.startsWith("data:image/");
// Option badges from a file: { "option": ["badge", …] }, anything else dropped.
function cleanBadges(b) {
  if (!b || typeof b !== "object" || Array.isArray(b)) return null;
  const out = {};
  for (const [k, v] of Object.entries(b)) {
    const arr = Array.isArray(v) ? [...new Set(clean(v))] : [];
    if (k.trim() && arr.length) out[k.trim()] = arr;
  }
  return Object.keys(out).length ? out : null;
}

function exportBackup() {
  const obj = {};
  db.lists.forEach((l) => {
    const extra = {
      ...(l.description && { description: l.description }),
      ...(l.labels && { labels: l.labels }),
      ...(l.badges && { badges: l.badges }),
      ...(l.image && { image: l.image }),
    };
    if (isMulti(l)) {
      obj[l.name] = {
        type: "multi", ...extra,
        categories: l.cats.map((c) => {
          const k = linkedList(c);
          return { name: c.name, ...(c.off && { off: true }), ...(k && { link: k.name }), items: c.items, ...(c.badges && { badges: c.badges }) };
        }),
      };
    } else {
      obj[l.name] = Object.keys(extra).length ? { ...extra, items: l.items } : l.items;
    }
  });
  const blob = new Blob([JSON.stringify(obj)], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Randomizer-Backup-${today()}.txt`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup saved to Downloads");
}

$("#file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (err) {}
  const names = obj && typeof obj === "object" && !Array.isArray(obj) ? Object.keys(obj).filter((k) => backupItems(obj[k]) || backupMulti(obj[k])) : [];
  if (!names.length) return toast("That file isn't a Randomizer backup");
  if (!(await ask("Restore from backup?", `Your ${plural(db.lists.length, "list")} will be replaced with the ${plural(names.length, "list")} in this backup.`, "Replace"))) return;

  // Keep emoji and history for lists that have the same name. Old-format
  // backups have no descriptions or images, so those lists keep their current ones too.
  const old = Object.fromEntries(db.lists.map((l) => [l.name, l]));
  db.lists = names.map((n, i) => {
    const name = n.trim(), prev = old[name], v = obj[n], multi = backupMulti(v);
    const list = { id: prev ? prev.id : uid(), name, emoji: prev ? prev.emoji : EMOJI[n] || EMOJI[name] || (multi ? MULTI_EMOJI : DEFAULT_EMOJI) };
    if (multi) {
      list.type = "multi";
      list.cats = v.categories.filter((c) => c && typeof c === "object").map((c) => ({
        id: uid(),
        name: String(c.name || "").trim() || "Category",
        items: clean(Array.isArray(c.items) ? c.items : []),
        ...(c.off === true && { off: true }),
        ...(cleanBadges(c.badges) && { badges: cleanBadges(c.badges) }),
        ...(c.link && { linkName: String(c.link).trim() }), // turned into an id below
      }));
    } else {
      list.items = clean(backupItems(v));
    }
    const description = Array.isArray(v) ? prev && prev.description : String(v.description || "").trim();
    if (description) list.description = description;
    const image = Array.isArray(v) ? prev && prev.image : isImage(v.image) && v.image;
    if (image) list.image = image;
    const labels = Array.isArray(v) ? prev && prev.labels : Array.isArray(v.labels) && [...new Set(clean(v.labels))];
    if (labels && labels.length) list.labels = labels;
    const badges = multi ? null : Array.isArray(v) ? prev && prev.badges : cleanBadges(v.badges);
    if (badges) list.badges = badges;
    list.created = prev ? prev.created : Date.now() + i; // keeps the backup's order for "Date created"
    return list;
  });
  const byName = Object.fromEntries(db.lists.filter((l) => !isMulti(l)).map((l) => [l.name, l.id]));
  db.lists.filter(isMulti).forEach((m) => m.cats.forEach((c) => {
    if (byName[c.linkName]) c.link = byName[c.linkName];
    delete c.linkName;
  }));
  const ids = new Set(db.lists.map((l) => l.id));
  for (const k of Object.keys(db.history)) if (!ids.has(k)) delete db.history[k];
  save();
  history.replaceState({ d: depth() }, "", "#/");
  render();
  toast(`Restored ${names.length} lists`);
});

/* =========================================================
   8. Little helpers + start
   ========================================================= */
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

render();

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
